<!doctype html><html lang="en"><meta charset="utf-8"><title>Overdrive — PixelLab motion review</title><style>body{margin:0;background:#101820;color:#e6edf2;font:15px system-ui}header{padding:18px 24px;border-bottom:1px solid #3a505f;display:flex;gap:18px;align-items:center;flex-wrap:wrap}h1{font-size:20px;margin:0}select,button,input{font:inherit;background:#203342;color:#fff;border:1px solid #5a7588;padding:6px}main{padding:20px;display:grid;grid-template-columns:minmax(600px,1fr) 280px;gap:20px}canvas{background:#1b2832;image-rendering:pixelated;max-width:100%;height:auto;border:1px solid #4b6574}#stage{width:1024px}aside{line-height:1.65}p{margin:12px 0}#film{display:block;margin:0 20px 30px;max-width:none}code{word-break:break-word;color:#98dedc}.legend{color:#dfca85}a{color:#83e9df}@media(max-width:900px){main{grid-template-columns:1fr}}</style>
<header><h1>Overdrive · PixelLab motion review</h1><select id="bank" aria-label="Animation"></select><button id="play">Pause</button><label>Speed <input id="speed" type="range" min=".1" max="2" step=".1" value="1"></label><label><input type="checkbox" id="onion" checked> Onion</label><button id="contacts">Contact sheet</button></header>
<main><canvas id="stage" width="512" height="384"></canvas><aside><p id="name"></p><p><input id="frame" type="range" min="0" max="1" value="0" aria-label="Frame"></p><p id="detail"></p><p class="legend">Green: body origin<br>Gold: ground baseline<br>Pink: weapon muzzle<br>Faint plates: previous / next frame</p><p>Every plate uses its exported root and native pixel size. Changing the pose never fits or resizes the body.</p><p><a href="../../../index.html?v=overdrive1018-gosfar45-r2&ready=1">Return to the game</a></p></aside></main><canvas id="film" hidden></canvas>
<script>window.TD_ASSAULT_ART={assets:{}};</script><script src="../manifest.js"></script><script>
const P=TD_GOSFAR45_ART,select=document.getElementById('bank'),stage=document.getElementById('stage'),ctx=stage.getContext('2d'),slider=document.getElementById('frame'),onion=document.getElementById('onion'),film=document.getElementById('film'),cache=new Map();let running=true,clock=0,last=0,current='';
for(const k of Object.keys(P.banks).sort()){const o=document.createElement('option');o.value=o.textContent=k;select.append(o);}select.value='hotwire/rifle/run_fire/east';
function imageFor(m){if(!cache.has(m.file)){const im=new Image();im.src='/'+m.file;cache.set(m.file,im);}return cache.get(m.file);}
function plate(c,key,x,y,alpha=1){const m=P.assets[key],im=imageFor(m);if(!im.complete||!im.naturalWidth)return;const r=m.rect||[0,0,...m.size];c.globalAlpha=alpha;c.drawImage(im,...r,x-m.anchor[0],y-m.anchor[1],r[2],r[3]);c.globalAlpha=1;}
function draw(){const b=P.banks[select.value];if(!b)return;const i=Number(slider.value),key=b.frames[i],m=P.assets[key];ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,512,384);ctx.fillStyle='#182630';ctx.fillRect(0,0,512,384);if(onion.checked){plate(ctx,b.frames[(i+b.frames.length-1)%b.frames.length],256,300,.24);plate(ctx,b.frames[(i+1)%b.frames.length],256,300,.2);}plate(ctx,key,256,300);ctx.strokeStyle='#57d4b3';ctx.beginPath();ctx.moveTo(256,28);ctx.lineTo(256,352);ctx.stroke();ctx.strokeStyle='#d4b866';ctx.beginPath();ctx.moveTo(48,300);ctx.lineTo(464,300);ctx.stroke();if(m.muzzle){const x=256+m.muzzle[0]-m.anchor[0],y=300+m.muzzle[1]-m.anchor[1];ctx.strokeStyle='#ff59df';ctx.beginPath();ctx.moveTo(x-4,y);ctx.lineTo(x+4,y);ctx.moveTo(x,y-4);ctx.lineTo(x,y+4);ctx.stroke();}document.getElementById('name').textContent=select.value;document.getElementById('detail').textContent='Frame '+(i+1)+' / '+b.frames.length+' · '+b.fps+' fps · '+b.size.join(' × ')+' pixels · Root '+b.origin.join(', ')+(b.held_pose?' · AVAILABLE-ART HELD CROUCH POSE':'');}
function change(){const b=P.banks[select.value];slider.max=b.frames.length-1;slider.value=0;clock=0;film.hidden=true;draw();}select.onchange=change;slider.oninput=()=>{running=false;document.getElementById('play').textContent='Play';draw();};document.getElementById('play').onclick=()=>{running=!running;document.getElementById('play').textContent=running?'Pause':'Play';};document.getElementById('contacts').onclick=()=>{const b=P.banks[select.value],w=b.size[0],h=b.size[1],cols=Math.min(8,b.frames.length);film.width=cols*w;film.height=Math.ceil(b.frames.length/cols)*(h+18);film.hidden=false;const c=film.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#1b2832';c.fillRect(0,0,film.width,film.height);b.frames.forEach((key,i)=>{const m=P.assets[key],x=i%cols*w,y=Math.floor(i/cols)*(h+18);plate(c,key,x+m.anchor[0],y+m.anchor[1]);c.fillStyle='#eee';c.fillText(i+1,x+4,y+h+12);});};function tick(t){const dt=Math.min(.1,(t-last)/1000||0);last=t;if(running){const b=P.banks[select.value];clock+=dt*Number(document.getElementById('speed').value);slider.value=Math.floor(clock*b.fps)%b.frames.length;}draw();requestAnimationFrame(tick);}change();requestAnimationFrame(tick);
</script></html>
