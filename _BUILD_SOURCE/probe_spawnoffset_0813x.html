<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>probe 0813x — spawn offset vs camera</title>
<!-- relative asset URLs resolve against the project root; see probe_arenafloor_0813i.html -->
<base href="../">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  #screen-area{position:absolute;left:0;top:0;width:480px;height:512px;overflow:hidden;}
  #screen{display:block;position:absolute;left:0;top:0;width:480px;height:512px;image-rendering:pixelated;}
  #hud-wrap,#equip-dom{position:absolute;left:-9999px;top:-9999px;}
  #tag{position:absolute;left:0;top:520px;color:#0f0;font:11px monospace;white-space:pre;}
</style></head>
<body>
<div id="screen-area"><canvas id="screen" width="480" height="512"></canvas></div>
<div id="hud-wrap"><canvas id="hud" width="480" height="62"></canvas></div>
<div id="equip-dom"><canvas id="equipcv" width="128" height="128"></canvas></div>
<div id="tag">boot</div>
<script src="assets/manifest.js"></script>
<script src="assets/section_geom.js"></script>
<script src="assets/game.js"></script>
<script>
/* PROBE 0813x — does the player's horizontal position change how far off-screen an enemy spawns?
   ?stage=<n>&type=<enemyType>

   offLeftX()/offRightX() are WORLD coordinates. drawWorld renders under translate(-camX), and camX
   follows the player across 0..WORLD_W-VW. So the question is not whether the offset is dynamic
   (it is a constant), but whether the RUNWAY it buys — the gap between the spawn point and the
   visible screen edge — stays constant as the camera pans. That is what is measured here. */
(function(){
  var Q  = new URLSearchParams(location.search);
  var SN = parseInt(Q.get('stage') || '1', 10);
  var TY = Q.get('type') || 's1jetDelta';
  var tag = document.getElementById('tag');

  var tries = 0;
  function ready(){
    if (typeof XART === 'undefined' || typeof _levelCfg !== 'function') return false;
    var c = _levelCfg(); if (!c) return false;
    return XART.rdy(c.master);
  }
  function boot(){
    tries++;
    if (!ready()){
      if (tries > 400){ tag.textContent = 'ART NEVER ARRIVED'; return; }
      if (tries === 1){ try{ run.stage=SN; curStage=STAGES[SN-1]; beginStage(SN); setState(GS.PLAY); }catch(e){} }
      setTimeout(boot, 25); return;
    }
    var DT = 1/60, out = [];
    var W = worldWidth();

    /* settle the camera at a given player x, then spawn one unit from each side and record where
       it actually IS relative to the SCREEN, not to the world. */
    function sample(label, px){
      player.reset(); player.x = px;
      for (var i=0;i<90;i++){ try{ updateCamX(); }catch(e){} }   // ease 0.12/frame -> settled
      var cam = camX;
      enemies.length = 0;
      var L = spawnEnemy(TY, offLeftX(),  -40, {});
      var R = spawnEnemy(TY, offRightX(), -40, {});
      function rec(e, side){
        if (!e) return {side:side, spawn:'REFUSED'};
        var half = (e.w||32)/2;
        // leading edge in SCREEN space: how far outside the visible 0..VW window it sits
        var runway = (side==='left') ? (cam - (e.x + half))       // gap from unit's right edge to screen x=0
                                     : ((e.x - half) - (cam+VW)); // gap from unit's left edge to screen x=VW
        return {side:side, worldX:Math.round(e.x), w:e.w,
                screenX:Math.round(e.x - cam), runway:Math.round(runway)};
      }
      out.push({at:label, playerX:Math.round(px), camX:Math.round(cam),
                left:rec(L,'left'), right:rec(R,'right')});
      enemies.length = 0;
    }

    sample('player HARD LEFT',  0);
    sample('player CENTRE',     W/2);
    sample('player HARD RIGHT', W);

    /* ⚠ TWO CANDIDATES, AND THEY LOOK THE SAME FROM A SINGLE FRAME. A 6px runway means the unit is
       already at the edge when it spawns; the edge pin at _edgeM = w*0.66 would instead SNAP it
       inward on a later tick. Tracing the leading edge per frame separates them: a smooth ramp is
       the runway, a discontinuity is the pin. */
    /* ⚠ REGRESSION GUARD. Broadening the clamp's trigger from the WORLD edge to the VISIBLE edge
       puts in-world placements within its reach for the first time. These must come back UNMOVED:
       a mid-screen placement, an off-camera in-world placement with a clear runway, and anything
       carrying `inPlace` (splitter halves, a surfacing maw). */
    var placements = [];
    (function(){
      player.reset(); player.x = 0;
      for (var i=0;i<90;i++){ try{ updateCamX(); }catch(e){} }
      function keep(label, ask, opt){
        enemies.length = 0;
        var e = spawnEnemy(TY, ask, 140, opt||{});
        placements.push({at:label, asked:Math.round(ask), got:e?Math.round(e.x):'REFUSED',
                         moved: e ? Math.round(e.x-ask) : null});
        enemies.length = 0;
      }
      keep('mid-screen',              240, {});
      keep('off-camera, in-world',    700, {});
      keep('inPlace at visible edge', 500, {inPlace:1});
    })();

    var trace = [];
    (function(){
      player.reset(); player.x = 0;
      for (var i=0;i<90;i++){ try{ updateCamX(); }catch(e){} }
      enemies.length = 0;
      var e = spawnEnemy(TY, offLeftX(), -40, {});
      if (e){
        for (var f=0; f<24; f++){
          var half=(e.w||32)/2;
          trace.push(Math.round((e.x + half) - camX));   // leading edge, screen space
          try{ updatePlay(DT); }catch(_){}
          if (e.dead) break;
        }
      }
      enemies.length = 0;
    })();

    tag.textContent = 'BEGIN\n' + JSON.stringify({
      placements: placements,
      leadingEdgeByFrame: trace,
      stage:SN, type:TY, worldW:W, VW:VW,
      offLeftX:offLeftX(), offRightX:offRightX(),
      camXrange:[0, Math.max(0, W-VW)],
      samples:out
    }, null, 1) + '\nEND';
  }
  boot();
})();
</script>
</body></html>
