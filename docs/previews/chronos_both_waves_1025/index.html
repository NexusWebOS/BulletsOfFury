<!doctype html><meta charset="utf-8"><title>Chronos rage showcase</title><style>body{background:#071521;color:#e5f5ff;font:18px system-ui;margin:24px}video{display:block;max-width:100%;width:1280px}button{font:inherit;margin:8px;padding:10px;background:#153b52;color:white;border:1px solid #5babc9}</style><h1>Chronos — transformation and rage attacks</h1><p>Audible native gameplay from a transformation checkpoint. Foreground and background palm volleys, then both the charged orb blast and hand-fired wave with sequential lightning.</p><video id="v" controls autoplay src="../../../_shots/chronos_both_waves_1025/video/rage-showcase.mp4"></video><div id="chapters"></div><script>fetch('../../../_shots/chronos_both_waves_1025/video/review.json').then(r=>r.json()).then(r=>{for(const [label,test] of [['Transformation',q=>q.charge],['Foreground volleys',q=>q.depth==='foreground'&&q.phase==='volley_warn'],['Background volleys',q=>q.depth==='background'&&q.phase==='volley_warn'],['Orb charge and blast',q=>q.phase==='gather'&&q.orb],['Hand-fired wave',q=>q.phase==='gather'&&!q.orb]]){const q=r.timeline.find(test);if(q){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{v.currentTime=Math.max(0,q.t-.3);v.play()};chapters.append(b)}}});</script>
