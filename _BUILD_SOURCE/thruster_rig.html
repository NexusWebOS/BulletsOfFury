<!doctype html><html><head><meta charset="utf-8"><title>BOF — Thruster Rig</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--line:#252c3a;--ink:#dfe6f2;--dim:#8994a8;--hot:#ffb14a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
header{padding:9px 16px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
h1{font-size:13px;margin:0;letter-spacing:.09em;color:var(--hot)}
.sub{color:var(--dim);font-size:11px}
main{display:grid;grid-template-columns:230px 1fr 296px;height:calc(100vh - 42px)}
#left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#find{margin:8px;padding:6px 8px;background:#0d1016;border:1px solid var(--line);color:var(--ink);
  font:inherit;border-radius:4px}
#list{overflow:auto;padding:0 8px 12px;flex:1}
#list button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
  color:var(--ink);padding:4px 8px;font:inherit;cursor:pointer;border-radius:4px;font-size:12px}
#list button:hover{background:#1b212c}
#list button.on{background:#22303f;border-color:#3a5570;color:#fff}
#list .hdr{color:var(--dim);font-size:10px;letter-spacing:.12em;margin:11px 0 3px;padding-left:8px}
.tag{float:right;color:#5a6478;font-size:10px}
#stage{display:flex;align-items:center;justify-content:center;position:relative;
  background:repeating-conic-gradient(#12151c 0% 25%,#0e1116 0% 50%) 50%/24px 24px}
canvas{image-rendering:pixelated;cursor:grab}canvas.drag{cursor:grabbing}
#nowt{position:absolute;top:10px;left:14px;color:var(--hot);font-size:12px;letter-spacing:.05em}
#side{border-left:1px solid var(--line);overflow:auto;padding:11px}
.row{margin-bottom:10px}
label{display:block;color:var(--dim);font-size:11px;margin-bottom:3px;letter-spacing:.04em}
input[type=range]{width:100%}
.val{float:right;color:var(--hot)}
.seg{display:flex;gap:5px;margin-bottom:8px}
.seg button{flex:1;background:#1b212c;border:1px solid var(--line);color:var(--ink);padding:5px;
  font:inherit;cursor:pointer;border-radius:4px;font-size:12px}
.seg button.on{background:#2b4a2b;border-color:#4a7a4a;color:#cfe}
textarea{width:100%;height:150px;background:#0d1016;color:#9ad;border:1px solid var(--line);
  font:11px/1.4 ui-monospace,monospace;padding:8px;border-radius:4px}
.go{width:100%;background:#2b4a2b;border:1px solid #4a7a4a;color:#dfe;padding:7px;font:inherit;
  cursor:pointer;border-radius:4px;margin-top:5px}
.go:hover{background:#356035}
kbd{background:#1b212c;border:1px solid var(--line);border-radius:3px;padding:1px 5px;font-size:11px}
.hint{color:var(--dim);font-size:11px;line-height:1.55}
</style></head><body>
<header><h1>BULLETS OF FURY — THRUSTER RIG</h1>
<span class="sub">drag to move &middot; <kbd>shift</kbd>+drag to rotate &middot; <kbd>&larr;&rarr;</kbd> switch unit</span>
<span class="sub" id="count"></span></header>
<main>
  <div id="left"><input id="find" placeholder="filter units..."><div id="list"></div></div>
  <div id="stage"><div id="nowt"></div><canvas id="cv" width="520" height="520"></canvas></div>
  <div id="side">
    <div class="row"><label>THRUSTER FAMILY</label>
      <div class="seg" id="fam"><button data-v="ice">ice</button>
        <button data-v="volcanic">volcanic</button><button data-v="own">own</button>
        <button data-v="">none</button></div></div>
    <div class="row"><label>EDITING <span class="val" id="whichL">LEFT</span></label>
      <div class="seg" id="which"><button data-v="L">left</button><button data-v="R">right</button></div></div>
    <div class="row"><label>X <span class="val" id="vx">0</span></label><input type="range" id="rx" min="-140" max="140" value="0"></div>
    <div class="row"><label>Y <span class="val" id="vy">0</span></label><input type="range" id="ry" min="-160" max="160" value="0"></div>
    <div class="row"><label>ROTATION <span class="val" id="vr">0&deg;</span></label><input type="range" id="rr" min="-180" max="180" value="0"></div>
    <div class="row"><label>SIZE <span class="val" id="vs">34</span></label><input type="range" id="rs" min="6" max="110" value="34"></div>
    <div class="row"><label>MIRROR</label>
      <div class="seg" id="mir"><button data-v="0">no</button><button data-v="1">yes</button></div></div>
    <button class="go" id="sym">copy left &rarr; right, mirrored</button>
    <div class="row" style="margin-top:12px"><label>EXPORT <span class="val" id="rigged">0 rigged</span></label>
      <textarea id="out" readonly></textarea>
      <button class="go" id="exp">build + copy to clipboard</button></div>
    <p class="hint">Only units you actually touch are exported, so you can do a few at a time.
    Point the plume AWAY from the hull, then paste the JSON back to Claude.</p>
  </div>
</main>

const IMG={}, cv=document.getElementById('cv'), cx=cv.getContext('2d');
let cur=DATA.units[0], side='L', t=0, touched={};
const RIG={};
const KINDS=[['PILOT SHIPS','ship'],['ARSENAL DRONES','drone'],['MINI BOSSES','miniboss'],['BOSSES','boss'],['ENEMIES','enemy']];
DATA.units.forEach(u=>RIG[u.id]={fam:u.kind==='ship'?'own':(u.kind==='drone'?'volcanic':''), 
  L:{x:-40,y:-40,r:90,s:34,m:0}, R:{x:40,y:-40,r:90,s:34,m:1}});
function load(k){ if(IMG[k])return IMG[k]; const i=new Image(); i.src='../'+DATA.paths[k]; IMG[k]=i; return i; }
const list=document.getElementById('list'), find=document.getElementById('find');
document.getElementById('count').textContent=DATA.units.length+' units';
function build(){
  list.innerHTML='';
  const q=find.value.trim().toLowerCase();
  KINDS.forEach(([lab,kind])=>{
    const us=DATA.units.filter(u=>u.kind===kind && (!q || (u.label+u.id).toLowerCase().includes(q)));
    if(!us.length) return;
    const h=document.createElement('div'); h.className='hdr'; h.textContent=lab+'  ('+us.length+')';
    list.appendChild(h);
    us.forEach(u=>{
      const b=document.createElement('button'); b.dataset.id=u.id;
      b.innerHTML=u.label.replace(/</g,'&lt;')+(touched[u.id]?'<span class="tag">rigged</span>':'');
      b.onclick=()=>{cur=u; sync();}; list.appendChild(b);
    });
  });
  document.querySelectorAll('#list button').forEach(b=>b.classList.toggle('on',b.dataset.id===cur.id));
}
find.oninput=build;
function seg(id,val,fn){ document.querySelectorAll('#'+id+' button').forEach(b=>{
  b.classList.toggle('on',b.dataset.v===String(val)); b.onclick=()=>{fn(b.dataset.v);touch();sync();};});}
function touch(){ touched[cur.id]=1; }
function sync(){
  const R=RIG[cur.id], S=R[side];
  document.getElementById('nowt').textContent=cur.label+'   ['+cur.grp+']';
  document.getElementById('rx').value=S.x; document.getElementById('vx').textContent=S.x;
  document.getElementById('ry').value=S.y; document.getElementById('vy').textContent=S.y;
  document.getElementById('rr').value=S.r; document.getElementById('vr').textContent=S.r+'\u00b0';
  document.getElementById('rs').value=S.s; document.getElementById('vs').textContent=S.s;
  document.getElementById('whichL').textContent=side==='L'?'LEFT':'RIGHT';
  document.getElementById('rigged').textContent=Object.keys(touched).length+' rigged';
  seg('fam',R.fam,v=>{R.fam=v;});
  seg('which',side,v=>{side=v;});
  seg('mir',S.m,v=>{RIG[cur.id][side].m=+v;});
  build();
}
['rx','ry','rr','rs'].forEach(id=>{document.getElementById(id).oninput=e=>{
  const S=RIG[cur.id][side],v=+e.target.value;
  if(id==='rx')S.x=v; if(id==='ry')S.y=v; if(id==='rr')S.r=v; if(id==='rs')S.s=v;
  touch(); sync();};});
document.getElementById('sym').onclick=()=>{const R=RIG[cur.id];
  R.R={x:-R.L.x,y:R.L.y,r:180-R.L.r,s:R.L.s,m:R.L.m?0:1}; touch(); sync();};
document.getElementById('exp').onclick=()=>{
  const o={};
  Object.keys(touched).forEach(k=>{const R=RIG[k];
    o[k]={thr:R.fam||null,
      L:{x:R.L.x,y:R.L.y,rot:R.L.r,size:R.L.s,mirror:!!R.L.m},
      R:{x:R.R.x,y:R.R.y,rot:R.R.r,size:R.R.s,mirror:!!R.R.m}};});
  const s=JSON.stringify(o,null,1);
  document.getElementById('out').value=s;
  if(navigator.clipboard) navigator.clipboard.writeText(s);
};
window.onkeydown=e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range') return;
  const i=DATA.units.indexOf(cur);
  if(e.key==='ArrowRight'){cur=DATA.units[(i+1)%DATA.units.length];sync();e.preventDefault();}
  if(e.key==='ArrowLeft'){cur=DATA.units[(i-1+DATA.units.length)%DATA.units.length];sync();e.preventDefault();}
};
function paint(){
  const W=cv.width,H=cv.height,C=W/2,M=H/2;
  cx.clearRect(0,0,W,H);
  const R=RIG[cur.id];
  const body=load(cur.frames[Math.floor(t*7)%cur.frames.length]);
  let bh=190,bw=190;
  if(body.naturalWidth){ const a=body.naturalWidth/body.naturalHeight;
    if(a>1){bw=Math.min(320,190*a);bh=bw/a;} else {bh=190;bw=bh*a;} }
  if(R.fam) ['L','R'].forEach(sd=>{
    const S=R[sd];
    let tkey;
    if(R.fam==='own' && cur.thr && cur.thr.length){
      tkey=cur.thr[Math.floor(t*18)%cur.thr.length];        // the pilot's own plume reel
    } else {
      tkey='ndt_'+R.fam+'_'+(sd==='L'?'left':'right')+'_'+(Math.floor(t*18)%4);
    }
    const ti=load(tkey);
    if(!ti.naturalWidth) return;
    const th=S.s*2.2, tw=th*(ti.naturalWidth/ti.naturalHeight);
    cx.save(); cx.globalCompositeOperation='lighter';
    cx.translate(C+S.x,M+S.y); cx.rotate(S.r*Math.PI/180);
    if(S.m) cx.scale(-1,1);
    cx.drawImage(ti,-tw*0.86,-th/2,tw,th); cx.restore();
    cx.save(); cx.strokeStyle=(sd===side)?'#ffb14a':'#48566b'; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(C+S.x,M+S.y,7,0,6.283); cx.stroke();
    cx.beginPath(); cx.moveTo(C+S.x,M+S.y);
    cx.lineTo(C+S.x+Math.cos(S.r*Math.PI/180)*24,M+S.y+Math.sin(S.r*Math.PI/180)*24);
    cx.stroke(); cx.restore();
  });
  if(body.naturalWidth) cx.drawImage(body,C-bw/2,M-bh/2,bw,bh);
  if(cur.core.length){ const co=load(cur.core[Math.floor(t*7)%cur.core.length]);
    if(co.naturalWidth){cx.save();cx.globalCompositeOperation='lighter';
      cx.globalAlpha=0.55+0.45*Math.sin(t*7);cx.shadowColor=cur.glow;cx.shadowBlur=18;
      cx.drawImage(co,C-bw/2,M-bh/2,bw,bh);cx.restore();}}
  cx.strokeStyle='#2a3342'; cx.beginPath();
  cx.moveTo(C-14,M);cx.lineTo(C+14,M);cx.moveTo(C,M-14);cx.lineTo(C,M+14);cx.stroke();
}
let drag=null;
cv.onmousedown=e=>{
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left-cv.width/2,my=e.clientY-r.top-cv.height/2;
  const R=RIG[cur.id]; let best=null,bd=1e9;
  ['L','R'].forEach(sd=>{const S=R[sd];const d=Math.hypot(mx-S.x,my-S.y);if(d<bd){bd=d;best=sd;}});
  if(bd<44){side=best;drag={rot:e.shiftKey};cv.classList.add('drag');sync();}
};
window.onmousemove=e=>{
  if(!drag)return;
  const r=cv.getBoundingClientRect(),mx=e.clientX-r.left-cv.width/2,my=e.clientY-r.top-cv.height/2;
  const S=RIG[cur.id][side];
  if(drag.rot) S.r=Math.round(Math.atan2(my-S.y,mx-S.x)*180/Math.PI);
  else {S.x=Math.round(mx);S.y=Math.round(my);}
  touch(); sync();
};
window.onmouseup=()=>{drag=null;cv.classList.remove('drag');};
sync();
(function loop(){t+=1/60;paint();requestAnimationFrame(loop);})();
</script></body></html>
