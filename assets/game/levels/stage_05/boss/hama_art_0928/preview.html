<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hama authored art review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090e16;color:#deeaf5;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:16px 24px;background:#101c2bed;border-bottom:1px solid #34556e}h1{font-size:24px;margin:0 0 6px;color:#70daff}p{margin:6px 0;color:#a8bdcc}nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}button,select{padding:7px 12px;border:1px solid #365b77;border-radius:4px;background:#16283c;color:#deefff;cursor:pointer}button.active{background:#205b79}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;padding:20px;max-width:1700px;margin:auto}article{min-width:0;background:#101a29;border:1px solid #27415a;border-radius:8px;padding:12px}h2{font-size:17px;margin:3px 0 8px}canvas{display:block;max-width:100%;height:330px;width:100%;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#111e2b 0% 25%,#152332 0% 50%) 50%/20px 20px}.detail{font-size:12px;color:#9fbdcf;min-height:38px;margin-top:8px}.cue{color:#ffcd72;height:20px;margin-top:6px}input{width:100%;accent-color:#61d6f5}footer{padding:24px;text-align:center;color:#9fbdcf}a{color:#72d8ff}.error{color:#ff7777}
</style>
<header><h1>HAMA · authored art review</h1><p>Hammer-only boss · moonwalks · full-turn lasso hops · two slams · helper throw · vocal leap</p><p>Silent art preview. Song timing, captions, password and combat stay with the gameplay agent.</p><nav><button id="play">Pause</button><select id="speed"><option value="0.5">Half speed</option><option value="1" selected>Normal</option><option value="2">Double speed</option></select><button data-filter="all" class="active">All frames</button><button data-filter="boss">Boss</button><button data-filter="helper">Helpers</button><button data-filter="head">Speaker heads</button><button data-filter="prop">Hammer</button><span id="count"></span></nav></header>
<main id="gallery"></main><footer><a href="INTEGRATION.md">Integration notes</a> · <a href="manifest.json">Frame metadata</a> · <a href="review/contact.png">Contact sheet</a></footer>
<script>
let entries=[],clock=0,paused=false,last=performance.now(),rate=1;
window.__ART_REVIEW__={ready:false,errors:[]};
document.querySelector('#play').onclick=()=>{paused=!paused;document.querySelector('#play').textContent=paused?'Play':'Pause'};
document.querySelector('#speed').onchange=e=>rate=Number(e.target.value);
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(v=>v.classList.toggle('active',v===b));entries.forEach(e=>e.card.hidden=b.dataset.filter!=='all'&&e.f.group!==b.dataset.filter)});
function draw(){const now=performance.now();if(!paused)clock+=(now-last)*rate;last=now;for(const e of entries){let idx=e.manual!==null?e.manual:Math.floor(clock*e.f.fps/1000)%e.f.frames.length;e.frame=idx;const r=e.f.frames[idx].rect;e.ctx.clearRect(0,0,e.cv.width,e.cv.height);e.ctx.drawImage(e.img,...r,0,0,e.cv.width,e.cv.height);e.slider.value=idx;e.cue.textContent=`Frame ${idx+1}/${e.f.frames.length}${e.f.events[String(idx)]?' · '+e.f.events[String(idx)].replaceAll('_',' '):''}`;}requestAnimationFrame(draw)}
(async()=>{const manifest=await(await fetch('manifest.json')).json();for(const [key,f] of Object.entries(manifest.families)){const card=document.createElement('article');card.innerHTML=`<h2>${key.replaceAll('_',' ')}</h2><canvas></canvas><div class="cue"></div><input type="range" min="0" max="${f.frames.length-1}" value="0"><div class="detail"></div>`;document.querySelector('#gallery').append(card);const cv=card.querySelector('canvas');[cv.width,cv.height]=f.size;const ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;const img=new Image();img.src=f.atlas;await img.decode();const e={key,f,card,cv,ctx,img,frame:0,manual:null,slider:card.querySelector('input'),cue:card.querySelector('.cue')};e.slider.oninput=()=>{paused=true;e.manual=Number(e.slider.value);document.querySelector('#play').textContent='Play';};card.querySelector('.detail').textContent=f.notes;card.ondblclick=()=>e.manual=null;entries.push(e);}const n=entries.reduce((n,e)=>n+e.f.frames.length,0);document.querySelector('#count').textContent=`${entries.length} reels · ${n} frames`;window.__ART_REVIEW__.ready=true;draw();})().catch(e=>{window.__ART_REVIEW__.errors.push(String(e));document.querySelector('#gallery').innerHTML=`<p class="error">${e}</p>`});
document.querySelector('#play').addEventListener('click',()=>{if(!paused)entries.forEach(e=>e.manual=null)});
</script></html>
