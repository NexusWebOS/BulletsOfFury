<!doctype html><meta charset="utf-8"><title>Hammer jumping windups and double swings</title><style>body{background:#101821;color:#def;font:17px system-ui;margin:24px}canvas{image-rendering:pixelated;max-width:95vw}button,input,select{font:inherit;margin:8px}</style><h1>Hammer jumping windups / Hama double</h1><p>Fixed authored frames. Red = contact; green = hammer light socket. Onion overlays are review tools.</p><select id="bank"></select><button id="play">Pause</button><input id="frame" type="range" min="0" value="0"><label><input id="onion" type="checkbox">Onion</label><span id="label"></span><br><canvas id="cv" width="640" height="640"></canvas><h2>Native double slams</h2><p>Stage5 / Stage8. Captured from the game renderer; development backgrounds.</p><img width="380" src="stage5-double.gif"><img width="380" src="stage8-double.gif"><script src="../../../assets/hammer_jump_art_1022.js"></script><script>
const bank=document.querySelector('#bank'),slider=document.querySelector('#frame'),ctx=document.querySelector('canvas').getContext('2d'),cache={};let playing=true;
for(const k of Object.keys(HJ22_ART.banks)){const o=document.createElement('option');o.value=o.textContent=k;bank.append(o)}
function draw(){const rows=HJ22_ART.banks[bank.value],i=+slider.value,a=rows[i];slider.max=rows.length-1;ctx.fillStyle='#111b29';ctx.fillRect(0,0,640,640);ctx.imageSmoothingEnabled=false;
function cell(n,alpha){const a=rows[(n+rows.length)%rows.length],s=HJ22_ART.sheets[a.sheet];let im=cache[a.sheet];if(!im){im=cache[a.sheet]=new Image();im.src='../../../'+s.path;im.onload=draw}if(!im.complete||!im.naturalWidth)return;ctx.globalAlpha=alpha;ctx.drawImage(im,...a.cell,320-a.pivot[0],280-a.pivot[1],a.w,a.h)}
if(document.querySelector('#onion').checked){cell(i-1,.18);cell(i+1,.18)}cell(i,1);ctx.globalAlpha=1;for(const[p,color]of [[a.tip,'red'],[a.glow,'lime']])if(p){ctx.strokeStyle=color;ctx.beginPath();ctx.arc(320-a.pivot[0]+p[0],280-a.pivot[1]+p[1],5,0,Math.PI*2);ctx.stroke()}document.querySelector('#label').textContent=i+' / '+(rows.length-1)}
bank.onchange=()=>{slider.value=0;draw()};slider.oninput=draw;document.querySelector('#onion').onchange=draw;document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};setInterval(()=>{if(playing){slider.value=(+slider.value+1)%HJ22_ART.banks[bank.value].length;draw()}},100);draw();</script>
