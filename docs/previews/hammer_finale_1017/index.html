(async()=>{const url=new URL('../../../index.html?revision=hammer-finale-1017',location.href),r=await fetch(url);if(!r.ok)throw Error('Game load failed: '+r.status);let html=await r.text();
 function isolate(){const prefix='BOF_HAMMER_FINALE_REVIEW_1017_',get=Storage.prototype.getItem,set=Storage.prototype.setItem,remove=Storage.prototype.removeItem,key=Storage.prototype.key;Storage.prototype.getItem=function(k){return get.call(this,prefix+k);};Storage.prototype.setItem=function(k,v){return set.call(this,prefix+k,v);};Storage.prototype.removeItem=function(k){return remove.call(this,prefix+k);};Storage.prototype.clear=function(){const keys=[];for(let i=0;i<this.length;i++){const k=key.call(this,i);if(k?.startsWith(prefix))keys.push(k);}for(const k of keys)remove.call(this,k);};window.__hammerFinaleReviewStorage=true;}
