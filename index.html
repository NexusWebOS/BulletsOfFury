<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bullets of Fury</title>
<style>
  @font-face{ font-family:'BOFmil'; src:url('assets/fonts/BlackOpsOne.ttf') format('truetype'); font-display:swap; }
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;
    font-family:"Courier New",monospace;color:#cfd6e0;-webkit-user-select:none;user-select:none;touch-action:none;}
  /* ROOM: a simple centred row — credits, game, credits. No cabinet, no filtered ancestor. */
  #room{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,54px);
    background:radial-gradient(130% 100% at 50% 12%, #181320 0%, #0b0b12 55%, #050507 100%);}
  #stage{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #marquee{display:block;object-fit:contain;position:relative;z-index:3;filter:drop-shadow(0 5px 16px rgba(0,0,0,.6));}
  #playrow{display:flex;flex-direction:row;align-items:center;gap:16px;position:relative;z-index:2;}
  .side{display:block;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));}
  /* black window: HUD row (HUD strip + equip box) on top, divider, native game canvas below */
  #game-frame{position:absolute;background:#000;overflow:hidden;z-index:1;
    display:flex;flex-direction:column;align-items:flex-start;}
  #hud-row{display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;flex:0 0 auto;}
  #hud-wrap{position:relative;flex:0 0 auto;background:#000;}
  #hud-wrap canvas{display:block;width:100%;height:100%;}
  #equip-dom{position:relative;flex:0 0 auto;pointer-events:none;}
  #equip-dom canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #hud-div{flex:0 0 auto;width:100%;height:3px;background:#2a2d33;box-shadow:0 1px 0 #15171b;}
  #screen-area{position:relative;flex:0 0 auto;width:100%;overflow:hidden;}
  /* The canvas is sized in JS by fitCanvas() (aspect-locked) and CENTRED here. It used to be
     forced to width:100%;height:100%, which stretched it to whatever shape #screen-area was and
     made fitCanvas's own sizing pointless — that is why fullscreen was off-centre and distorted. */
  #screen-area canvas{display:block;position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);image-rendering:auto;background:#000;}
  #hint{position:fixed;left:8px;bottom:6px;font-size:11px;color:#3a4350;opacity:.55;pointer-events:none;}

  /* ---- FULLSCREEN button ---- */
  #fs-btn{position:fixed;right:12px;top:12px;z-index:50;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(18,24,36,0.82);border:2px solid #4a90c0;border-radius:7px;
    color:#cfe2ff;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:background .12s,border-color .12s;-webkit-user-select:none;user-select:none;}
  #fs-btn:hover{background:#243550;border-color:#8fd0ff;}
  #fs-btn svg{width:20px;height:20px;pointer-events:none;fill:currentColor;}

  /* ---- FULLSCREEN mode: hide the cabinet art, blow the play window up to fill the screen ---- */
  body.fs #room{background:#000;}
  body.fs #marquee,
  body.fs #side-left,
  body.fs #side-right{display:none !important;}
  body.fs #playrow{gap:0;}
  body.fs #game-frame{border-radius:0;box-shadow:none;}
  /* POSITION:FIXED CONTAINING-BLOCK TRAP.
     #cabinet carries a drop-shadow filter, and ANY filtered ancestor becomes the containing block
     for its position:fixed descendants. So #game-frame's fullscreen left/top were being measured
     from the CABINET's box instead of the viewport — and since the cabinet is flex-centred inside
     #room, that offset pushed the whole game across. Clearing the filter (and collapsing the
     cabinet, which is invisible in fullscreen anyway) makes fixed mean fixed again. */
  body.fs
  body.fs #stage{gap:0 !important;}
  body.fs #hint{display:none;}
  body.fs #fs-btn{opacity:0.25;}
  body.fs #fs-btn:hover{opacity:1;}


  /* CREDIT RAILS. Vertical text either side of the play window. pointer-events:none so they can
     never intercept a click meant for the canvas — the whole reason the cabinet came out. */
  #credit-left,#credit-right{
    pointer-events:none; user-select:none;
    font-family:'BOFmil',monospace; letter-spacing:.14em; line-height:1.5;
    font-size:clamp(9px,1.05vw,15px);
    color:#8e9bb3; text-shadow:0 0 10px rgba(120,160,255,.22);
    flex:0 0 auto; white-space:nowrap;
  }
  #credit-left{text-align:right;}
  #credit-right{text-align:left;}
  #credit-left .yr{color:#c9a227;}
  #credit-right .nick{color:#c9a227;}
  @media (max-width:820px){ #credit-left,#credit-right{display:none;} }
  body.fs #credit-left, body.fs #credit-right{display:none;}
</style>
</head>
<body>
<div id="room">
  <!-- CABINET REMOVED (drop 0724dk). The cabinet image sat above the play area with its own
       stacking context, its own drop-shadow filter (which changes what `position:fixed` means for
       every descendant), and a JS layout pass that repositioned #game-frame into a hard-coded
       window rect. Mike asked for it gone; it also removes a whole class of suspects for input
       that does not land where it looks like it should. -->
  <div id="credit-left">COLEFORGE<br>PRODUCTIONS<br><span class="yr">2026</span></div>
  <div id="game-frame">
    <div id="hud-row">
      <div id="hud-wrap"><canvas id="hud" width="480" height="62"></canvas></div>
      <div id="equip-dom"><canvas id="equipcv" width="128" height="128"></canvas></div>
    </div>
    <div id="hud-div"></div>
    <div id="screen-area"><canvas id="screen" width="480" height="512"></canvas></div>
  </div>
  <div id="credit-right">A GAME BY<br>MIKE<br><span class="nick">&ldquo;FORGEMASTER&rdquo;</span><br>COLE</div>
</div>
<div id="fs-btn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
  <svg id="fs-icon-enter" viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm0 6h2v3h3v2H4v-5zm16 0v5h-5v-2h3v-3h2zM20 9h-2V6h-3V4h5v5z"/></svg>
  <svg id="fs-icon-exit" viewBox="0 0 24 24" style="display:none"><path d="M9 4v5H4V7h3V4h2zm11 3v2h-5V4h2v3h3zM9 20H7v-3H4v-2h5v5zm11-5v2h-3v3h-2v-5h5z"/></svg>
</div>
<div id="hint">MOVE: mouse / WASD &nbsp; FIRE: J &nbsp; BOMB: K &nbsp; START/OK: Enter &nbsp; PAUSE: P &nbsp; FULLSCREEN: F</div>
<script>
(function(){
  // OUT-OF-BOUNDS EQUIPPED box: renders the current weapon pickup icon in the box art,
  // to the right of the game screen. Hidden when no weapon / player dead.
  var cv=document.getElementById('equipcv'); if(!cv) return;
  var g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  var WT={0:'mg',1:'spread',2:'missile',3:'laser',4:'firewall',5:'iceorb'};
  window.__drawEquipDom=function(px){
    var W=cv.width, H=cv.height; g.clearRect(0,0,W,H);
    /* GAMEPLAY ONLY (drop 0809p). The box was drawn in every state, so the boot logo, the
       arcade attract reel and the pilot select all carried an EQUIPPED panel hanging over
       them. It belongs to the run, not to the app. Cleared above, so hiding is simply
       returning early. */
    /* ⚠ NOT window.state. game.js declares it with `let` at top level, which creates a LEXICAL
       global - reachable as a bare identifier from another classic script, but never a property
       of window. Reading window.state gives undefined and would hide the box in every state,
       including gameplay. */
    var st = null;
    try { st = state; } catch(e) { st = null; }
    if(st !== null &&
       !(st==='play' || st==='paused' || st==='stageclear' || st==='continue' || st==='gameover')) return;
    var X=(window.XART||null);
    if(!X || !X.rdy || !X.rdy('nequipbox')) return;
    var box=X.get('nequipbox');
    g.drawImage(box,0,0,W,H);
    try{
      var run=window.run;
      if(run && !window.player.dead && run.weapon!=null){
        var wt=WT[run.weapon]||'mg';
        var wlv=Math.max(1,Math.min(5,(run.wlevels&&run.wlevels[run.weapon])||run.wlevel||1));
        /* ⚠ THE PRECEDING COMMENT WAS WRONG AND IT COST MIKE THE RIGHT ICON (fixed 0810s).
           micon_* DOES exist — as 57 rects in BOFX.icons, the THIRD art store, which XART can
           never answer for. So `X.rdy('micon_...')` was false for every weapon on every frame,
           the micon_ candidate always lost, and this quietly drew the older *_icon_* set. That
           is "I see your using a basic graphic for fireball icon".

           And WT above is a second weapon table: it hard-codes 5:'iceorb', so slot 5 could never
           show the fireball no matter which store answered. weaponIconKey is the game's own
           resolver and already knows stage 3 dispenses the fireball and that Freezer's is the
           fire/ice ball (0806d). Ask IT, and blit through the shared iconBlit so this surface and
           the in-game one cannot drift apart again. The old chain stays as the fallback. */
        var cx=W*0.499, cy=H*0.505, drew=null;
        var ik = null;
        try { ik = weaponIconKey(run.weapon, wlv); } catch(e){ ik = 'micon_'+wt+'_'+wlv; }
        g.save(); g.shadowColor='#ffb24a'; g.shadowBlur=6;
        try { if(typeof iconBlit==='function') drew = iconBlit(g, ik, cx, cy, H*0.56, true); }
        catch(e){ drew = null; }
        if(drew==null){
          var alt = (wt==='iceorb') ? 'ice' : wt;
          var cands = [alt+'_icon_'+wlv, alt+'_icon_1', alt+'_icon'];
          for(var ci=0; ci<cands.length; ci++){ if(X.rdy(cands[ci])){ ik = cands[ci]; break; } }
          if(ik && X.rdy(ik)){
            var im=X.get(ik), fit=W*0.52, ss=Math.min(fit/im.naturalWidth, fit/im.naturalHeight);
            g.drawImage(im, cx-im.naturalWidth*ss/2, cy-im.naturalHeight*ss/2,
                        im.naturalWidth*ss, im.naturalHeight*ss);
          }
        }
        g.restore();
      }
    }catch(e){}
  };
  // redraw each frame so the icon follows weapon changes / death
  function tick(){ if(window.__drawEquipDom) window.__drawEquipDom(); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
})();
</script>
<script src="assets/manifest.js"></script>
<!-- Measured section geometry for the eight 0801hm miniboss bodies (window.BOFSG).
     Must load BEFORE game.js: sxDraw composites the body from its section plates
     using these offsets, and sxHit attributes shots with these centroids. -->
<script src="assets/section_geom.js"></script>
<script src="assets/game.js"></script>
<script>
(function(){
  var GA=480/512, SIDE_A=335/1042, MARQ_A=693/179, HUD_R=62/512, gap=16, FR=14, mgap=6, MSCALE=1.12;
  function isFS(){ return document.body.classList.contains('fs'); }
  /* LAYOUT WITHOUT THE CABINET (drop 0724dk).
     The old version mapped the play area into a hard-coded window rect inside the cabinet image
     (WIN_L/T/R/B as fractions of a 1448x1086 plate) and positioned #game-frame absolutely into it.
     That is gone. The room is now a plain flex row and the play window is simply sized to fit the
     viewport at the game's own aspect, so what you click is where it looks. */
  var GW=480, GH=512, HUDH=62, DIVH=6;
  function fit(){
    var vw=innerWidth, vh=innerHeight;
    function S(id,w,h){ var e=document.getElementById(id); if(e){ e.style.width=w+'px'; e.style.height=h+'px'; } }
    var reserve = isFS() ? 0 : Math.min(vw*0.34, 420);      // room for the credit rails
    var availW = Math.max(200, vw - reserve);
    var availH = vh * (isFS()? 1.0 : 0.94);
    var totalH = GH + HUDH + DIVH;
    var sc = Math.min(availW/GW, availH/totalH);
    var gw = Math.round(GW*sc), gh = Math.round(GH*sc);
    var hh = Math.round(HUDH*sc), dh = Math.round(DIVH*sc);
    var gf=document.getElementById('game-frame');
    if(gf){ gf.style.position='relative'; gf.style.left='0px'; gf.style.top='0px'; }
    S('game-frame', gw, gh+hh+dh);
    S('hud-row', gw, hh); S('hud-wrap', gw, hh);
    S('hud-div', gw, dh);
    S('screen-area', gw, gh);
    var sa=document.getElementById('screen-area'); if(sa) sa.style.marginLeft='0px';
    var scr=document.getElementById('screen'); if(scr){ scr.style.width=gw+'px'; scr.style.height=gh+'px'; }
    var hud=document.getElementById('hud');     if(hud){ hud.style.width=gw+'px';  hud.style.height=hh+'px'; }
  }
  /* The old layout function was named L and the listeners still referenced it; my replacement is
     fit(). Aliasing keeps every existing call site working instead of hunting them all. */
  var L = fit;
  window.addEventListener('resize',L); window.addEventListener('load',L);
  fit();

  // ---- FULLSCREEN toggle ----
  var root=document.getElementById('room');
  function fsElement(){ return document.getElementById('room'); }
  function inNativeFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }
  function requestFS(el){
    if(el.requestFullscreen) return el.requestFullscreen();
    if(el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    if(el.mozRequestFullScreen) return el.mozRequestFullScreen();
    if(el.msRequestFullscreen) return el.msRequestFullscreen();
  }
  function exitFS(){
    if(document.exitFullscreen) return document.exitFullscreen();
    if(document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if(document.mozCancelFullScreen) return document.mozCancelFullScreen();
    if(document.msExitFullscreen) return document.msExitFullscreen();
  }
  function toggleFS(){
    if(inNativeFS()){ exitFS(); }
    else { try{ var p=requestFS(fsElement()); if(p&&p.catch) p.catch(function(){ /* fallback: CSS-only fill */ document.body.classList.add('fs'); syncFSicon(); L(); }); }catch(e){ document.body.classList.add('fs'); } }
  }
  function syncFSicon(){
    var on=document.body.classList.contains('fs');
    var a=document.getElementById('fs-icon-enter'), b=document.getElementById('fs-icon-exit');
    if(a) a.style.display=on?'none':'block';
    if(b) b.style.display=on?'block':'none';
  }
  function onFSchange(){
    if(inNativeFS()) document.body.classList.add('fs'); else document.body.classList.remove('fs');
    syncFSicon(); L(); setTimeout(L,50);
  }
  document.addEventListener('fullscreenchange',onFSchange);
  document.addEventListener('webkitfullscreenchange',onFSchange);
  document.addEventListener('mozfullscreenchange',onFSchange);
  document.addEventListener('MSFullscreenChange',onFSchange);
  var fsBtn=document.getElementById('fs-btn');
  if(fsBtn) fsBtn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); toggleFS(); });
  // F key toggles fullscreen (ignored while typing a password, handled by game input otherwise)
  window.addEventListener('keydown',function(e){
    if((e.key==='f'||e.key==='F') && !e.ctrlKey && !e.metaKey && !e.altKey){
      var st=(window.BOFGAME&&window.BOFGAME.state)||'';
      // don't hijack F if a text field is focused
      var ae=document.activeElement; if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')) return;
      e.preventDefault(); toggleFS();
    }
  });
  window.fsToggle=toggleFS;

  L(); setTimeout(L,60); setTimeout(L,300);
})();
</script>
</body>
</html>
