<!doctype html><html lang="en"><meta charset="utf-8"><title>Symbiote portal animation review</title>
<style>body{margin:0;background:#08090d;color:#eee;font:16px system-ui}main{max-width:1000px;margin:24px auto;padding:16px}h1{font-size:22px}section{display:flex;gap:20px;flex-wrap:wrap}figure{margin:0}canvas{width:440px;height:330px;image-rendering:pixelated;border:1px solid #35353c;background:radial-gradient(#202329,#07080c 70%)}figcaption{margin:7px 0 18px}button,input{font:inherit}button{padding:7px 14px;background:#48120f;color:white;border:1px solid #9c3b30}input{width:300px}small{display:block;color:#aaa;margin-top:8px}</style>
<main><h1>Symbiote portal motion review</h1><p>Both sheets have sixteen authored frames. The ground-rise portal is a separate intro/attack effect; the circular portal is a ship-free death overlay.</p><section><figure><canvas id="ground" width="440" height="330"></canvas><figcaption>Ground portal rise</figcaption></figure><figure><canvas id="death" width="440" height="330"></canvas><figcaption>Circular void death</figcaption></figure></section><button id="toggle">Pause</button> <input id="frame" type="range" min="0" max="15" value="0"> <output id="value">Frame 1 / 16</output><small>Click Pause, then scrub through each frame. Animation playback: 2.4 seconds per cycle.</small></main>
<script>
const sources=[['ground','ground_portal_rise_sheet.png'],['death','void_death_sheet.png']];
const images={};for(const [id,src] of sources){let im=new Image();im.src=src;images[id]=im;}
let playing=true,frame=0,last=0;const slider=document.querySelector('#frame'),value=document.querySelector('#value');
function draw(){for(const [id] of sources){const cv=document.getElementById(id),g=cv.getContext('2d'),im=images[id];g.clearRect(0,0,cv.width,cv.height);if(!im.complete||!im.naturalWidth)continue;g.imageSmoothingEnabled=false;const cw=im.naturalWidth/4,ch=im.naturalHeight/4,sx=(frame%4)*cw+2,sy=Math.floor(frame/4)*ch+2;g.drawImage(im,sx,sy,cw-4,ch-4,10,0,420,315);}slider.value=frame;value.textContent=`Frame ${frame+1} / 16`;}
function tick(t){if(playing&&t-last>=150){frame=(frame+1)%16;last=t;draw();}requestAnimationFrame(tick);}slider.addEventListener('input',()=>{playing=false;document.getElementById('toggle').textContent='Play';frame=+slider.value;draw();});document.getElementById('toggle').addEventListener('click',e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play';});for(const im of Object.values(images))im.onload=draw;draw();requestAnimationFrame(tick);
</script></html>
