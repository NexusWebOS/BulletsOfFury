<style>
  /* Command Signal shares the uppercase bitmap dialogue letterforms with legacy canvas text. */
  @font-face{ font-family:'BOFmil'; src:url('assets/game/shared/fonts/fonts/command_0914/BOFCommandSignal.ttf') format('truetype'); font-display:swap; }
  html,body{margin:0;padding:0;height:100%;background:#05060a;overflow:hidden;
    font-family:"Courier New",monospace;color:#cfd6e0;-webkit-user-select:none;user-select:none;touch-action:none;}
  /* ROOM: a simple centred row â€” credits, game, credits. No cabinet, no filtered ancestor. */
  #room{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,54px);
    background:radial-gradient(130% 100% at 50% 12%, #181320 0%, #0b0b12 55%, #050507 100%);}
  #stage{display:flex;flex-direction:column;align-items:center;gap:6px;}
  #marquee{display:block;object-fit:contain;position:relative;z-index:3;filter:drop-shadow(0 5px 16px rgba(0,0,0,.6));}
  #playrow{display:flex;flex-direction:row;align-items:center;gap:16px;position:relative;z-index:2;}
  .side{display:block;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));}
  /* black window: HUD row (HUD strip + equip box) on top, divider, native game canvas below */
  #game-frame{position:relative;flex:0 0 auto;background:#000;overflow:hidden;z-index:1;
    display:flex;flex-direction:column;align-items:flex-start;}
  #hud-row{display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-start;flex:0 0 auto;}
  #hud-wrap{position:relative;flex:0 0 auto;background:#000;}
  #hud-wrap canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #equip-dom{position:relative;flex:0 0 auto;pointer-events:none;}
  #equip-dom{display:none;} /* compact equipped socket now lives in the three-part in-play HUD */
  #equip-dom canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #hud-div,#hud-div2{flex:0 0 auto;width:100%;height:3px;background:#2a2d33;box-shadow:0 1px 0 #15171b;}
  #hud-bottom{position:relative;flex:0 0 auto;background:#000;}
  #hud-bottom canvas{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #screen-area{position:relative;flex:0 0 auto;width:100%;overflow:hidden;}
  /* The canvas is sized in JS by fitCanvas() (aspect-locked) and CENTRED here. It used to be
     forced to width:100%;height:100%, which stretched it to whatever shape #screen-area was and
     made fitCanvas's own sizing pointless â€” that is why fullscreen was off-centre and distorted. */
  /* image-rendering was `auto`, i.e. the browser bilinear-scaled the backing canvas AGAIN on the
     way to the display â€” a second blur on top of the one imageSmoothingEnabled was adding. The
     equip-box canvas below already had `pixelated`; the game canvas is the one the player looks
     at, so it is the one that needed it. */
  #screen-area canvas{display:block;position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);image-rendering:pixelated;background:#000;}
  #hint{position:fixed;left:8px;right:8px;bottom:6px;display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:22px;visibility:hidden;font-size:10px;color:#afbdce;pointer-events:none;}
  #hint span{display:inline-flex;align-items:center;gap:5px;} #hint canvas{image-rendering:pixelated;}

  /* ---- FULLSCREEN button ---- */
  #fs-btn{position:fixed;right:12px;top:12px;z-index:50;width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(18,24,36,0.82);border:2px solid #4a90c0;border-radius:7px;
    color:#cfe2ff;box-shadow:0 4px 14px rgba(0,0,0,.5);transition:background .12s,border-color .12s;-webkit-user-select:none;user-select:none;}
  #fs-btn:hover{background:#243550;border-color:#8fd0ff;}
  #fs-btn{padding:0;background:transparent;border:0;border-radius:0;width:48px;height:48px;}
  #fs-btn img{width:100%;height:100%;object-fit:contain;pointer-events:none;image-rendering:pixelated;}
  #fs-btn:focus-visible{outline:2px solid #ffd65c;outline-offset:3px;}

  /* ---- FULLSCREEN mode: hide the cabinet art, blow the play window up to fill the screen ---- */
  body.fs #room{background:#000;}
  body.fs #room::before{content:none;}
  #wide-map-world{position:fixed;inset:0;display:none;z-index:0;pointer-events:none;image-rendering:pixelated;}
  .wide-overlay{position:fixed;display:none;z-index:2;pointer-events:none;image-rendering:pixelated;filter:drop-shadow(0 8px 20px rgba(0,0,0,.75));}
  #wide-clock{z-index:4;}
  #wide-map-top{position:fixed;display:none;z-index:2;pointer-events:none;background:#0a1a2b url('assets/game/shared/campaign/campaign_map_v2/ocean.png') center/cover no-repeat;}
  body.wide-map #room{background:#04102a;}
  body.wide-map #game-frame{box-shadow:none;background:transparent;width:93.75vh !important;height:100vh !important;}
  body.wide-map #hud-row,body.wide-map #hud-div,body.wide-map #hud-bottom,body.wide-map #hud-div2{display:none !important;}
  body.wide-map #screen-area,body.wide-map #screen{width:100% !important;height:100% !important;}
  body.campaign-full #room{display:block;background:#04102a;}
  body.campaign-full #marquee,body.campaign-full .side,body.campaign-full #credit-left,body.campaign-full #credit-right,
  body.campaign-full #hud-row,body.campaign-full #hud-div,body.campaign-full #hud-bottom,body.campaign-full #hud-div2,body.campaign-full #hint{display:none !important;}
  body.campaign-full #game-frame{position:fixed !important;inset:0 !important;width:100vw !important;height:100vh !important;box-shadow:none;}
  body.campaign-full #screen-area{position:fixed;inset:0;width:100vw !important;height:100vh !important;margin:0 !important;}
  body.campaign-full #screen{width:100vw !important;height:min(100vh,106.666667vw) !important;}
  /* Wide menus and the boot plate own the full middle bay; gameplay retains the top HUD. */
  @media(min-width:1150px){
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #hud-row,
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #hud-div,
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #hud-bottom,
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #hud-div2{display:none !important;}
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #screen-area,
    body.fs:not(.wide-playing):not(.wide-map):not(.cinematic-full) #screen{width:100% !important;height:100% !important;}
  }
  @media(max-width:1149px){.wide-overlay{display:none !important;}}
  body.fs #marquee,
  body.fs #side-left,
  body.fs #side-right{display:none !important;}
  body.fs #playrow{gap:0;}
  body.fs #game-frame{border-radius:0;box-shadow:none;}
  /* POSITION:FIXED CONTAINING-BLOCK TRAP.
     #cabinet carries a drop-shadow filter, and ANY filtered ancestor becomes the containing block
     for its position:fixed descendants. So #game-frame's fullscreen left/top were being measured
     from the CABINET's box instead of the viewport â€” and since the cabinet is flex-centred inside
     #room, that offset pushed the whole game across. Clearing the filter (and collapsing the
     cabinet, which is invisible in fullscreen anyway) makes fixed mean fixed again. */
  body.fs #stage{gap:0 !important;}
  body.fs #hint{display:none;}
  body.fs #fs-btn{opacity:0.25;}
  body.fs #fs-btn:hover{opacity:1;}


  /* CREDIT RAILS. Vertical text either side of the play window. pointer-events:none so they can
     never intercept a click meant for the canvas â€” the whole reason the cabinet came out. */
  #credit-left,#credit-right{
    pointer-events:none; user-select:none;
    font-family:'BOFmil',monospace; letter-spacing:.14em; line-height:1.5;
    font-size:clamp(9px,1.05vw,15px);
    color:#8e9bb3; text-shadow:0 0 10px rgba(120,160,255,.22);
    flex:1 1 0; min-width:0; white-space:nowrap;
  }
  #credit-left{text-align:right;}
  #credit-right{text-align:left;}
  #credit-left .yr{color:#c9a227;}
  #credit-right .nick{color:#c9a227;}
  #credit-left img,#credit-right img{display:block;width:min(100%,260px);max-height:68vh;object-fit:contain;image-rendering:pixelated;}
  #credit-left img{margin-left:auto;}
  @media (max-width:820px){ #credit-left,#credit-right{display:none;} }
  body.fs #credit-left, body.fs #credit-right{display:none;}
  body.cinematic-full #room{background:#000;display:block;}
  body.cinematic-full #credit-left,
  body.cinematic-full #credit-right,
  body.cinematic-full #hud-row,
  body.cinematic-full #hud-div,
  body.cinematic-full #hud-bottom,
  body.cinematic-full #hud-div2,
  body.cinematic-full #fs-btn,
  body.cinematic-full #hint{display:none !important;}
  body.cinematic-full #game-frame{position:fixed !important;inset:0 !important;width:100vw !important;
    height:100vh !important;background:#000;display:block;overflow:hidden;}
  body.cinematic-full #screen-area{position:fixed;inset:0;width:100vw !important;height:100vh !important;
    margin:0 !important;overflow:hidden;}
  body.cinematic-full #screen{width:100vw !important;height:100vh !important;}
</style>

<body>
<div id="room">
  <!-- CABINET REMOVED (drop 0724dk). The cabinet image sat above the play area with its own
       stacking context, its own drop-shadow filter (which changes what `position:fixed` means for
       every descendant), and a JS layout pass that repositioned #game-frame into a hard-coded
       window rect. Mike asked for it gone; it also removes a whole class of suspects for input
       that does not land where it looks like it should. -->
  <div id="credit-left"><img src="assets/game/shared/ui/playthrough_1011/brand-plaque.png" alt="COLEFORGE PRODUCTIONS 2026"></div>
  <div id="game-frame">
    <div id="hud-row">
      <!-- 1009: the HUD draws to #hud off screen; feedback_1009.js copies its score strip to #hud-top
           (above the playfield) and its five-panel housing to #hud-bot (below it). -->
      <canvas id="hud" width="480" height="104" style="display:none"></canvas>
      <div id="hud-wrap"><canvas id="hud-top" width="960" height="68"></canvas></div>
      <div id="equip-dom"><canvas id="equipcv" width="128" height="128"></canvas></div>
    </div>
    <div id="hud-div"></div>
    <div id="screen-area"><canvas id="screen" width="480" height="512"></canvas></div>
    <div id="hud-div2"></div>
    <div id="hud-bottom"><canvas id="hud-bot" width="960" height="140"></canvas></div>
  </div>
  <div id="credit-right"><img src="assets/game/shared/ui/playthrough_1011/author-plaque.png" alt="A game by Mike FORGEMASTER Cole"></div>

<script>
(function(){
  // OUT-OF-BOUNDS EQUIPPED box: renders the current weapon pickup icon in the box art,
  // to the right of the game screen. Hidden when no weapon / player dead.
  var cv=document.getElementById('equipcv'); if(!cv) return;
  var g=cv.getContext('2d'); g.imageSmoothingEnabled=false;
  var WT={0:'mg',1:'spread',2:'missile',3:'laser',4:'firewall',5:'iceorb',6:'lasermist'};
  window.__drawEquipDom=function(px){
    var W=cv.width, H=cv.height; g.clearRect(0,0,W,H);
    /* GAMEPLAY ONLY (drop 0809p). The box was drawn in every state, so the boot logo, the
       arcade attract reel and the pilot select all carried an EQUIPPED panel hanging over
       them. It belongs to the run, not to the app. Cleared above, so hiding is simply
       returning early. */
    /* âš  NOT window.state. game.js declares it with `let` at top level, which creates a LEXICAL
       global - reachable as a bare identifier from another classic script, but never a property
       of window. Reading window.state gives undefined and would hide the box in every state,
       including gameplay. */
    var st = null;
    try { st = state; } catch(e) { st = null; }
    if(st !== null &&
       !(st==='play' || st==='paused' || st==='stageclear' || st==='continue' || st==='gameover')) return;
    var X=(window.XART||null);
    if(!X || !X.rdy || !X.rdy('nequipbox')) return;
    var box=X.get('nequipbox');
    g.drawImage(box,0,0,W,H);
    try{
      var run=window.run;
      if(run && !window.player.dead && run.weapon!=null){
        var wt=WT[run.weapon]||'mg';
        var wlv=Math.max(1,Math.min(5,(run.wlevels&&run.wlevels[run.weapon])||run.wlevel||1));
        /* âš  THE PRECEDING COMMENT WAS WRONG AND IT COST MIKE THE RIGHT ICON (fixed 0810s).
           micon_* DOES exist â€” as 57 rects in BOFX.icons, the THIRD art store, which XART can
           never answer for. So `X.rdy('micon_...')` was false for every weapon on every frame,
           the micon_ candidate always lost, and this quietly drew the older *_icon_* set. That
           is "I see your using a basic graphic for fireball icon".

           And WT above is a second weapon table: it hard-codes 5:'iceorb', so slot 5 could never
           show the fireball no matter which store answered. weaponIconKey is the game's own
           resolver and already knows stage 3 dispenses the fireball and that Freezer's is the
           fire/ice ball (0806d). Ask IT, and blit through the shared iconBlit so this surface and
           the in-game one cannot drift apart again. The old chain stays as the fallback. */
        var cx=W*0.499, cy=H*0.505, drew=null;
        var ik = null;
        try { ik = weaponIconKey(run.weapon, wlv); } catch(e){ ik = 'micon_'+wt+'_'+wlv; }
        g.save(); g.shadowColor='#ffb24a'; g.shadowBlur=6;
        try { if(typeof iconBlit==='function') drew = iconBlit(g, ik, cx, cy, H*0.56, true); }
        catch(e){ drew = null; }
        /* THE INFUSION BADGE (0917): the element riding the held weapon, top-right of the icon,
           with its level as pips. A layer on the gun, drawn as a layer on the icon. */
        try{ if(typeof infusionActive==='function' && infusionActive() && typeof INFUSIONS!=='undefined'){
          var I=INFUSIONS[run.infusion.elem], bx=cx+H*0.22, by=cy-H*0.22, bs=H*0.22;
          g.save(); g.shadowColor=I.glow; g.shadowBlur=8;
          var bd=null; try{ bd=iconBlit(g,'inf_'+run.infusion.elem,bx,by,bs,true); }catch(e2){ bd=null; }
          if(bd==null){ g.translate(bx,by); g.rotate(Math.PI/4); g.fillStyle=I.body; g.fillRect(-bs/2,-bs/2,bs,bs);
            g.fillStyle='#fff'; g.globalAlpha=0.85; g.fillRect(-bs/5,-bs/5,bs*0.4,bs*0.4); g.globalAlpha=1;
            g.strokeStyle='#101018'; g.lineWidth=1.5; g.strokeRect(-bs/2,-bs/2,bs,bs); g.rotate(-Math.PI/4); g.translate(-bx,-by); }
          g.shadowBlur=0; g.fillStyle=I.glow;
          for(var pi=0; pi<(run.infusion.lv|0); pi++){ g.fillRect(bx+bs*0.7+pi*4, by-bs*0.5+pi*0, 3, 3); }
          g.restore(); } }catch(e3){}
        if(drew==null){
          var alt = (wt==='iceorb') ? 'ice' : wt;
          var cands = [alt+'_icon_'+wlv, alt+'_icon_1', alt+'_icon'];
          for(var ci=0; ci<cands.length; ci++){ if(X.rdy(cands[ci])){ ik = cands[ci]; break; } }
          if(ik && X.rdy(ik)){
            var im=X.get(ik), fit=W*0.52, ss=Math.min(fit/im.naturalWidth, fit/im.naturalHeight);
            g.drawImage(im, cx-im.naturalWidth*ss/2, cy-im.naturalHeight*ss/2,
                        im.naturalWidth*ss, im.naturalHeight*ss);
          }
        }
        g.restore();
      }
    }catch(e){}
  };
  // redraw each frame so the icon follows weapon changes / death
  function tick(){ if(window.__drawEquipDom) window.__drawEquipDom(); requestAnimationFrame(tick); }
  requestAnimationFrame(tick);
})();
</script>
<!-- Establish the complete shell before scripts or images can delay first paint. -->
<script>
(function(){
  var GA=480/512, SIDE_A=335/1042, MARQ_A=693/179, HUD_R=62/512, gap=16, FR=14, mgap=6, MSCALE=1.12;
  function isFS(){ return document.body.classList.contains('fs'); }
  /* LAYOUT WITHOUT THE CABINET (drop 0724dk).
     The old version mapped the play area into a hard-coded window rect inside the cabinet image
     (WIN_L/T/R/B as fractions of a 1448x1086 plate) and positioned #game-frame absolutely into it.
     That is gone. The room is now a plain flex row and the play window is simply sized to fit the
     viewport at the game's own aspect, so what you click is where it looks. */
  var GW=480, GH=512, DIVH=2;
  window.__bofHudHeight=104;
  function fit(){
    var vw=innerWidth, vh=innerHeight;
    if(window.BOFSideHUD&&window.BOFSideHUD.fit(vw,vh))return;
    function S(id,w,h){ var e=document.getElementById(id); if(e){ e.style.width=w+'px'; e.style.height=h+'px'; } }
    if(document.body.classList.contains('cinematic-full')||document.body.classList.contains('campaign-full')){
      var gf0=document.getElementById('game-frame'),sa0=document.getElementById('screen-area'),scr0=document.getElementById('screen');
      if(gf0){gf0.style.marginBottom='0px';gf0.style.position='fixed';gf0.style.left='0px';gf0.style.top='0px';gf0.style.width=vw+'px';gf0.style.height=vh+'px';}
      if(sa0){sa0.style.width=vw+'px';sa0.style.height=vh+'px';sa0.style.marginLeft='0px';}
      if(scr0){scr0.style.width=vw+'px';scr0.style.height=vh+'px';}
      return;
    }
    var reserve = isFS() || vw<=820 ? 0 : Math.min(vw*0.34, 420);      // room for the credit rails
    var availW = Math.max(200, vw - reserve);
    /* 1009: the five-panel HUD now sits at the bottom of the frame, where the fixed control-hint
       strip (#hint, 22px at bottom:6px) would cover it. Keep that strip's height clear of the frame
       whenever it can be on screen; fullscreen hides the strip and keeps every pixel. */
    var hintEl=document.getElementById('hint'), hintH=(!isFS()&&hintEl&&getComputedStyle(hintEl).display!=='none')?30:0;
    var availH = vh - hintH; // the browser bay uses every other vertical pixel
    // Wide gameplay and menus have different HUD visibility. Read that
    // actual visibility before fitting so a hidden row cannot squeeze menus.
    if(isFS()&&vw>=1150){try{document.body.classList.toggle('wide-playing',['play','paused','continue','stageclear','gameover'].indexOf(state)>=0);}catch(e){}}
    var hudStyle=getComputedStyle(document.getElementById('hud-row'));
    var hudShown=hudStyle.display!=='none'&&hudStyle.visibility!=='hidden';
    var HUDH=hudShown?(window.__bofHudHeight||104):0;
    var totalH = GH + HUDH + (hudShown?2*DIVH:0);
    var sc = Math.min(availW/GW, availH/totalH);
    var gw = Math.floor(GW*sc);
    /* 1009: each 104px seat row is a 70px housing (now under the playfield) and a 34px score
       strip (still on top). The total budget is unchanged; it is split, not grown. */
    var seatH=window.__bofHudSeatHeight||104,houseH=window.__bofHudHouseHeight||70;
    var rowsH = HUDH>0 ? HUDH/seatH : 0, topL = (seatH-houseH)*rowsH, botL = HUDH-topL;
    var hh = Math.round(topL*sc), hb = Math.round(botL*sc), dh = hudShown?Math.max(1,Math.round(DIVH*sc)):0;
    // Allocate the final screen from the shared budget: independent
    // rounded heights could exceed the viewport and clip its first/last pixel.
    var gh = Math.max(1,Math.floor(totalH*sc+1e-6)-hh-hb-2*dh);
    var gf=document.getElementById('game-frame');
    if(gf){ gf.style.position='relative'; gf.style.left='0px'; gf.style.top='0px'; gf.style.marginBottom=hintH+'px'; }
    S('game-frame', gw, gh+hh+hb+2*dh);
    S('hud-row', gw, hh); S('hud-wrap', gw, hh);
    S('hud-div', gw, dh); S('hud-div2', gw, dh); S('hud-bottom', gw, hb);
    var hbRow=document.getElementById('hud-bottom'), hd2=document.getElementById('hud-div2');
    if(hbRow) hbRow.style.display = hudShown ? '' : 'none';
    if(hd2) hd2.style.display = hudShown ? '' : 'none';
    S('screen-area', gw, gh);
    var sa=document.getElementById('screen-area'); if(sa) sa.style.marginLeft='0px';
    var scr=document.getElementById('screen'); if(scr){ scr.style.width=gw+'px'; scr.style.height=gh+'px'; }
    var hud=document.getElementById('hud-top'); if(hud){ hud.style.width=gw+'px';  hud.style.height=hh+'px'; }
    var hbot=document.getElementById('hud-bot'); if(hbot){ hbot.style.width=gw+'px'; hbot.style.height=hb+'px'; }
  }
  /* The old layout function was named L and the listeners still referenced it; my replacement is
     fit(). Aliasing keeps every existing call site working instead of hunting them all. */
  var L = fit;
  window.__bofFit=fit;
  window.addEventListener('resize',L); window.addEventListener('orientationchange',L);
  fit();

  // ---- FULLSCREEN toggle ----
  var root=document.getElementById('room');
  function fsElement(){ return document.documentElement; }
  function inNativeFS(){ return !!(document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement); }
  function requestFS(el){
    if(el.requestFullscreen) return el.requestFullscreen();
    if(el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
    if(el.mozRequestFullScreen) return el.mozRequestFullScreen();
    if(el.msRequestFullscreen) return el.msRequestFullscreen();
  }
  function exitFS(){
    if(document.exitFullscreen) return document.exitFullscreen();
    if(document.webkitExitFullscreen) return document.webkitExitFullscreen();
    if(document.mozCancelFullScreen) return document.mozCancelFullScreen();
    if(document.msExitFullscreen) return document.msExitFullscreen();
  }
  function toggleFS(){
    if(inNativeFS()){ exitFS(); }
    else if(document.body.classList.contains('fs')){document.body.classList.remove('fs');syncFSicon();L();}
    else { try{ var p=requestFS(fsElement());if(!p&&!inNativeFS()){document.body.classList.add('fs');syncFSicon();L();} if(p&&p.catch) p.catch(function(){ /* fallback: CSS-only fill */ document.body.classList.add('fs'); syncFSicon(); L(); }); }catch(e){ document.body.classList.add('fs');syncFSicon();L(); } }
  }
  function syncFSicon(){
    var on=document.body.classList.contains('fs');
    var b=document.getElementById('fs-btn');if(b){b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');b.title=on?'Exit fullscreen (F)':'Fullscreen (F)';}
  }
