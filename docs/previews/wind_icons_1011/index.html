<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wind projectile badges</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090e16;color:#d6e4ec;font:16px/1.5 system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{color:#7bebc9}h2{font-size:19px}a{color:#92dfff}.symbol{display:flex;gap:24px;align-items:center;background:#121e2c;padding:20px;border:1px solid #32475d}.symbol img{width:112px;height:112px;image-rendering:pixelated}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#13202e;border:1px solid #32475d;padding:12px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.levels img{display:block;width:100%;image-rendering:pixelated}.level{text-align:center;font-size:12px}.capture img{width:100%;display:block}.capture{margin:14px 0;background:#142230;padding:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.symbol{flex-direction:column}}</style>
<main><h1>Wind: fired shots and elemental reward</h1><p>Projectile badges follow the existing framed weapon icons. Every weapon has levels I–V. The Wind element uses its own gust symbol.</p><p><a href="../../../index.html?revision=wind-icons-1011">Play the game</a> · <a href="../../feedback/WIND_ICONS_1011.md">Art, prompts and verification</a></p><div id="symbol" class="symbol"></div><h2>Upgrade-menu badges</h2><div id="icons" class="grid"></div><h2>In the running game</h2><div id="captures"></div></main>
<script>let review,ready=0,total=0;function picture(a){const im=new Image;total++;im.onload=()=>ready++;im.src='../../../'+a.path+'?v='+a.sha256.slice(0,12);im.alt=a.name||'Wind element';return im;}fetch('review.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{review=d;const s=document.getElementById('symbol'),t=document.createElement('p');t.textContent='Stage 6 boss reward · Wind element · Forge element selector';s.append(picture(d.symbol),t);for(let slot=0;slot<9;slot++){const list=d.icons.filter(a=>a.slot===slot),c=document.createElement('article'),h=document.createElement('h2'),g=document.createElement('div');c.className='card';h.textContent=list[0].name;g.className='levels';for(const a of list){const x=document.createElement('div'),label=document.createElement('span');x.className='level';label.textContent=['I','II','III','IV','V'][a.level-1];x.append(picture(a),label);g.append(x);}c.append(h,g);document.getElementById('icons').append(c);}for(const a of d.captures){const f=document.createElement('figure'),im=new Image,cap=document.createElement('figcaption');f.className='capture';im.src=a.path;im.alt=a.title;cap.textContent=a.title;f.append(im,cap);document.getElementById('captures').append(f);}});</script></html>
