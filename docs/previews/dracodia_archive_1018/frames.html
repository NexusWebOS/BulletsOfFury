<script>
const labels={bastion_download:'Iron Bastion · download',camo_download:'Camo Colossus · download',halberd_download:'Blue archive gunship · download',bomb_charge:'Code bomb · charge',bomb_burst:'Code bomb · detonation',wrap:'Lightning · Complete wrap',wrap_front:'Lightning · Near side',wrap_back:'Lightning · Far side',bolt:'Lightning · Forked discharge',orb:'Lightning · Crackling ball',tether:'Lightning · Generator links',storm_loop:'Void storm · parallax',transfer_loop:'Escort data transfer'};
const banks=Object.fromEntries([...Object.entries(D20_ART.models).map(([k,m])=>[k+'_download',{frames:m.download,fps:m.download.length/2}]),...Object.entries(D20_ART.fx).filter(([k])=>k!=='lightning_loop'),...Object.entries(L21_ART.banks),['wrap',{...L21_ART.banks.wrap_front,secondary:L21_ART.banks.wrap_back.frames}]]),select=document.querySelector('#bank'),slider=document.querySelector('#frame'),canvas=document.querySelector('#art'),g=canvas.getContext('2d'),images=new Map(),tints=new Map();let playing=true,clock=0,previous=performance.now(),active;

const requested=new URLSearchParams(location.search).get('bank');if(banks[requested])select.value=requested;else if(requested==='lightning_loop')select.value='wrap';
async function choose(){active=banks[select.value];tints.clear();slider.max=active.frames.length-1;slider.value=0;clock=0;document.querySelector('#info').textContent='Loading…';await Promise.all([...active.frames,...(active.secondary||[])].map(a=>new Promise((resolve,reject)=>{if(images.has(a.key)){resolve();return;}const im=new Image();im.onload=()=>{images.set(a.key,im);resolve();};im.onerror=()=>reject(Error('Missing '+a.key));im.src=a.path;})));history.replaceState(null,'','docs/previews/dracodia_archive_1018/frames.html?bank='+select.value);render();}
