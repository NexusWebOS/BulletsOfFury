<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Overdrive — PixelLab animation review</title>
<style>body{margin:20px;background:#101823;color:#e2eaf1;font:16px system-ui}h1{font-size:24px}button,select,label{margin:5px;padding:7px;background:#233343;color:#eef5ff;border:1px solid #718494}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;border:1px solid #527487}p{max-width:900px;color:#b9cddb}a{color:#80dcff}</style>
<h1>Overdrive — PixelLab enemy animations</h1><p>Four weapon classes. Review the motion at normal or half speed, pause, and step through each drawing. Background, HUD and gameplay previews are in the <a href="../../index.html?fullscreen=0&build=overdrive1014-pixel25-r1">updated game</a>.</p>
<select id="action"><option>walk</option><option>fire</option><option>crouch</option><option>death</option><option>strafe</option><option>vault</option><option>idle</option></select><select id="direction"><option>south</option><option>east</option><option>north</option><option>west</option></select><button id="pause">Pause</button><button id="previous">Previous</button><button id="next">Next</button><label><input id="slow" type="checkbox">Half speed</label><label><input id="onion" type="checkbox">Previous / next overlay</label><label><input id="root" type="checkbox">Foot baseline</label><canvas id="review" width="880" height="520"></canvas><p id="status">Loading artwork…</p>
<script>
let data,images={},frame=0,paused=false,last=0,t=0;const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id),kinds=['rifle','heavy','rocket','laser'];
function selected(kind){const key='px25_'+kind+'_'+$('action').value+'_'+$('direction').value;return data.sequences[key]||null;}
function paint(){if(!data)return;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#17232f';ctx.fillRect(0,0,880,520);for(let i=0;i<4;i++){const x=i*220,q=selected(kinds[i]);ctx.fillStyle=i%2?'#1e2b39':'#23313d';ctx.fillRect(x+3,30,214,452);ctx.fillStyle='#bde9fc';ctx.font='17px monospace';ctx.fillText(kinds[i].toUpperCase(),x+12,22);if(!q){ctx.font='12px monospace';ctx.fillText('No clip for this facing',x+10,80);continue;}const n=frame%q.frames.length,draw=(j,alpha)=>{const key=q.frames[(j+q.frames.length)%q.frames.length],m=data.assets[key],im=images[key];if(!im)return;ctx.globalAlpha=alpha;ctx.drawImage(im,x+110-m.anchor[0]*1.8,415-m.anchor[1]*1.8,m.size[0]*1.8,m.size[1]*1.8);ctx.globalAlpha=1;};if($('onion').checked){draw(n-1,.22);draw(n+1,.22);}draw(n,1);if($('root').checked){ctx.strokeStyle='#85baaf';ctx.beginPath();ctx.moveTo(x+8,415.5);ctx.lineTo(x+212,415.5);ctx.stroke();}ctx.fillStyle='#c9d5df';ctx.font='13px monospace';ctx.fillText('Frame '+(n+1)+' / '+q.frames.length,x+12,469);}$('status').textContent='Original pixel artwork • fixed body size and shared foot roots • '+(paused?'Paused':'Playing');}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';paint();};$('previous').onclick=()=>{paused=true;frame=Math.max(0,frame-1);paint();};$('next').onclick=()=>{paused=true;frame++;paint();};for(const id of ['action','direction','slow','onion','root'])$(id).onchange=()=>{frame=0;t=0;paint();};
async function begin(){data=await(await fetch('manifest.json')).json();await Promise.all(Object.entries(data.assets).filter(([k])=>k.startsWith('px25_')).map(([key,m])=>new Promise(resolve=>{let im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=resolve;im.src='../../../../'+m.file;})));paint();requestAnimationFrame(loop);}
function loop(now){const dt=last?(now-last)/1000:0;last=now;if(!paused){t+=dt*($('slow').checked?.5:1);if(t>=1/16){frame++;t%=1/16;paint();}}requestAnimationFrame(loop);}begin();
</script></html>
