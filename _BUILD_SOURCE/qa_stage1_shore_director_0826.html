<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <base href="../">
  <title>Stage 1 Shore Director QA</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05080b;display:grid;place-items:center}
    canvas{image-rendering:pixelated}
    #hud,#equipcv{display:none}
  </style>
</head>
<body>
  <canvas id="screen" width="480" height="512"></canvas>
  <canvas id="hud" width="480" height="62"></canvas>
  <canvas id="equipcv" width="128" height="128"></canvas>
  <pre id="qa-state" hidden></pre>
  <script src="assets/manifest.js"></script>
  <script src="assets/section_geom.js"></script>
  <script src="assets/game.js"></script>
  <script>
  (() => {
    const phase=new URLSearchParams(location.search).get('phase') || 'shore';
    run.stage=1; curStage=STAGES[0]; state=GS.PLAY;
    enemies.length=0; eBullets.length=0; pBullets.length=0;
    boss=null; bossActive=false; bossWarned=true;
    subBoss=null; subBossActive=false; subBossDone=false; subBossTriggered=false;
    aminiTriggered=true; _sc1=_sc2=_mc1=_mc2=true;
    player.reset(); player.x=VW/2; player.y=VH*0.84; player.invuln=1e9;
    stagePlan=buildStagePlan(1); _waveGap=0; _s1GroundHold=false;

    if(phase==='cruiser'){
      mapScroll=2100;
      stageTimer=curStage.length*0.63;
      waveIdx=stagePlan.findIndex(w=>w.t>52);
      if(waveIdx<0) waveIdx=stagePlan.length;
    } else {
      mapScroll=1440;
      stageTimer=36.05;
      waveIdx=stagePlan.findIndex(w=>w.t===36);
      for(let i=0;i<6;i++){
        const e=spawnEnemy('s1jetdelta', VW*(0.15+i*0.14), 54+(i%2)*42, {});
        if(e){ e._qaBlock=true; e._entry=0; e.vx=0; e.vy=0; }
      }
      /* Exercise the real pressure gate first, then let the due beach wave through. */
      setTimeout(()=>{
        for(let i=enemies.length-1;i>=0;i--) if(enemies[i]._qaBlock) enemies.splice(i,1);
      },8000);
    }

    const sample=()=>{
      window.__qaStage1={
        phase, stageTimer, mapScroll, waveIdx, groundHold:_s1GroundHold,
        warning:warnKind, warningTime:warnT,
        subBossTriggered, subBossActive,
        subBossKind:subBoss&&subBoss.kind,
        enemyKinds:enemies.filter(e=>!e.dead).map(e=>e.type||e.kind||e._nefKey||'unknown')
      };
      document.getElementById('qa-state').textContent=JSON.stringify(window.__qaStage1);
    };
    sample(); setInterval(sample,100);
  })();
  </script>
</body>
</html>
