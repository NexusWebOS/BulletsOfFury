<script>
const game=document.querySelector('#game'),status=document.querySelector('#status'),difficulty=document.querySelector('#difficulty'),safe=document.querySelector('#safe');let phase='head',loaded=false;
const sleep=n=>new Promise(r=>setTimeout(r,n));
async function begin(next=phase){
 if(!loaded)return;phase=next;status.textContent='Loading Stage 2…';
 game.contentWindow.eval(`(()=>{pilotIndex=PILOTS.findIndex(p=>p.key==='cole');run.pilot='cole';run.stage=2;run.mode='campaign';startRun(2);diffKey=${JSON.stringify(difficulty.value)};DIFF=DIFFS[diffKey];curStage=STAGES[1];beginStage(2);setState(GS.PLAY);player.reset();BOFCinematicDirector.cancel();story=fb2Talk=s6Opening=null;stagePlan=[];enemies=[];eBullets=[];pBullets=[];subBoss=null;subBossActive=false;subBossDone=true;boss=null;bossActive=false;spawnBoss('infernoreaver');furnaceSync(boss);if(${JSON.stringify(phase)}!=='intro'){furnaceEnter(boss,${JSON.stringify(phase)});boss._fz.trans=0;boss._mwStun=0;if(boss._mwBarrier){boss._mwBarrier.active=false;boss._mwBarrier.breakT=0;}}player.invuln=${safe.checked?'99999':'0'};player.x=worldWidth()/2;player.y=VH*.82;f17Warm();})()`);
 status.textContent=difficulty.value+' · '+(phase==='head'?'eye-laser phase':phase==='arms'?'armor phase':'complete fight');game.contentWindow.focus();
}
for(const b of document.querySelectorAll('[data-phase]'))b.onclick=()=>begin(b.dataset.phase);
difficulty.onchange=()=>begin();safe.onchange=()=>{if(loaded)game.contentWindow.eval('player.invuln='+(safe.checked?'99999':'0'));};
game.onload=async()=>{for(let i=0;i<200;i++){if(game.contentWindow.eval('window.__bofFrames>4&&typeof FURNACE17!=="undefined"')){loaded=true;await begin();return;}await sleep(100);}status.textContent='The game did not finish loading. Reload this page.';};
</script>
