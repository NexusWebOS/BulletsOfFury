<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bullets of Fury · Asset Library</title>
<style>body{margin:0;background:#07131c;color:#d8e6ef;font:16px system-ui}header,main{max-width:1200px;margin:auto;padding:24px}h1{margin:0;color:#77dce8}p{line-height:1.6;color:#a7bdcb}a{color:#77dce8}input,select{background:#142734;color:white;border:1px solid #416070;padding:12px;border-radius:6px;max-width:100%}.filters{display:flex;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#07131c;padding:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#112430;padding:16px;border:1px solid #264657;border-radius:8px;overflow-wrap:anywhere}.preview{height:170px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#172c3a 0% 25%,#10212b 0% 50%) 0/16px 16px}.preview img{max-width:100%;max-height:170px;image-rendering:pixelated}.card h3{font-size:16px}small{color:#aac0ce}button{background:#1f5263;color:white;border:0;padding:12px;border-radius:6px;cursor:pointer}code{font-size:13px}#status{color:#8ee2b0}</style>
<header><h1>Bullets of Fury · Asset Library</h1><p>Find art by pilot, level, folder or runtime key. The physical folders contain the actual assets; an atlas stores many frames in one image. Previews load only when you request them.</p><a href="docs/ASSET_LAYOUT_1007.md">Loading and editing guide</a> · <a href="assets/data/asset_catalog.json">Complete machine-readable catalog</a></header>
<main><div class="filters"><select id="owner" aria-label="Asset owner"><option value="">All owners</option></select><select id="mode" aria-label="Inventory mode"><option value="files">Physical files</option><option value="assets">Logical frames</option></select><input id="search" type="search" placeholder="Search name, folder, key…" aria-label="Search assets"><button id="more">Next page</button></div><p id="status">Loading the catalog…</p><div class="grid" id="grid"></div></main>
<script>
'use strict';let catalog,page=0;const size=36,$=id=>document.getElementById(id);function el(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n;}function render(){const own=$('owner').value,q=$('search').value.toLowerCase(),mode=$('mode').value;const rows=catalog[mode].filter(a=>(!own||a.owner===own)&&JSON.stringify(a).toLowerCase().includes(q));if(page*size>=rows.length)page=0;$('grid').replaceChildren();$('status').textContent=rows.length+' results · page '+(page+1)+' of '+Math.max(1,Math.ceil(rows.length/size))+' · 36 records per page';for(const a of rows.slice(page*size,(page+1)*size)){const card=el('article');card.className='card';card.append(el('h3',a.key||a.path.split('/').pop()),el('small',a.owner));const link=el('a',a.path);link.href=a.path;link.target='_blank';card.append(el('p'));card.lastChild.append(link);if(a.cell)card.append(el('p','Atlas crop: '+JSON.stringify(a.cell)));if(a.width)card.append(el('p',a.width+' × '+a.height+' · '+Math.round(a.bytes/1024)+' KB'));if(a.role)card.append(el('small',a.role));if(/\.(png|jpe?g|webp)$/i.test(a.path)&&a.role!=='legacy supporting file; not a decodable texture'){const b=el('button','Preview texture');b.onclick=()=>{const box=el('div');box.className='preview';const im=el('img');im.alt=a.key||a.path;im.decoding='async';im.src=a.path;if(mode==='assets'&&a.cell&&a.cell.slice(1,5).every(Number.isFinite)){im.onload=()=>{const [,x,y,w,h]=a.cell;if(x>=0&&y>=0&&w>0&&h>0&&x+w<=im.naturalWidth&&y+h<=im.naturalHeight){const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.cssText='max-width:100%;max-height:170px;image-rendering:pixelated';cv.getContext('2d').drawImage(im,x,y,w,h,0,0,w,h);im.replaceWith(cv);}};}box.append(im);b.replaceWith(box);};card.append(el('p'));card.lastChild.append(b);}$('grid').append(card);}$('more').disabled=rows.length<=size;}
fetch('assets/data/asset_catalog.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json();}).then(c=>{catalog=c;for(const own of [...new Set(c.files.map(a=>a.owner))].sort()){const o=el('option',own);o.value=own;$('owner').append(o);}render();}).catch(e=>$('status').textContent=e.message);for(const id of ['owner','mode','search'])$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render();});$('more').onclick=()=>{page++;render();};
</script></html>
