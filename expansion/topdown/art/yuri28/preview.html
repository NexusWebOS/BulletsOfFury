<!doctype html><html lang="en"><meta charset="utf-8"><title>Yuri — upward side-aim animation review</title><style>body{background:#13202a;color:#dceff4;font:15px system-ui;margin:20px}canvas{max-width:100%;height:auto;image-rendering:pixelated}button,label{margin:5px;padding:7px}a{color:#83f0f3}</style><h1>Yuri — up-screen side-step and fire</h1><p>Left/right facing while moving upward. Fixed body scale and foot root. <a href="../../index.html?fullscreen=0&build=overdrive1015-yuri28-r1">Play Overdrive</a></p><button id="pause">Pause</button><button id="prev">Previous</button><button id="next">Next</button><label><input id="slow" type="checkbox">Half speed</label><label><input id="onion" type="checkbox">Previous/next overlay</label><label><input id="old" type="checkbox">Existing Yuri size reference</label><canvas id="review" width="960" height="320"></canvas><p id="status">Loading…</p><script>
let data,images={},n=0,paused=false,last=0,clock=0;const cv=document.querySelector('canvas'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id),cards=[['west','up_step'],['west','up_fire'],['east','up_step'],['east','up_fire']];
function paint(){if(!data)return;ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1d2b35';ctx.fillRect(0,0,960,320);cards.forEach(([dir,action],i)=>{const x=i*240,q=data.sequences['y28_'+dir+'_'+action],key=q.frames[n%q.frames.length],m=data.assets[key],scale=2.2;ctx.fillStyle='#e3f5fa';ctx.font='16px monospace';ctx.fillText(dir.toUpperCase()+' / '+action,x+8,24);ctx.strokeStyle='#57766f';ctx.beginPath();ctx.moveTo(x+8,270);ctx.lineTo(x+232,270);ctx.stroke();const draw=(key,alpha)=>{const m=data.assets[key];ctx.globalAlpha=alpha;ctx.drawImage(images[key],x+120-m.anchor[0]*scale,270-m.anchor[1]*scale,m.size[0]*scale,m.size[1]*scale);ctx.globalAlpha=1;};if($('old').checked&&images['old_'+dir]){ctx.globalAlpha=.3;ctx.drawImage(images['old_'+dir],x+120-96*scale,270-160*scale,192*scale,224*scale);ctx.globalAlpha=1;}if($('onion').checked){draw(q.frames[(n+q.frames.length-1)%q.frames.length],.22);draw(q.frames[(n+1)%q.frames.length],.22);}draw(key,1);ctx.fillText('Frame '+(n%q.frames.length+1)+' /'+q.frames.length,x+8,304);});$('status').textContent=(paused?'Paused':'Playing')+' ·28 generated motion drawings plus mirrored right facing';}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';};$('prev').onclick=()=>{paused=true;n=(n+15)%16;paint();};$('next').onclick=()=>{paused=true;n++;paint();};for(const id of ['slow','onion','old'])$(id).onchange=paint;
async function begin(){data=await(await fetch('manifest.json')).json();await Promise.all([...Object.entries(data.assets).map(([k,m])=>[k,'../../../../'+m.file]),...['east','west'].map(d=>['old_'+d,'../bastion19/frames/pb19_yuri_'+d+'_walk_0.png'])].map(([key,src])=>new Promise(resolve=>{const im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=resolve;im.src=src;})));paint();requestAnimationFrame(loop);}function loop(now){const dt=last?(now-last)/1000:0;last=now;if(!paused){clock+=dt*($('slow').checked?.5:1);if(clock>=1/16){n++;clock%=1/16;paint();}}requestAnimationFrame(loop);}begin();</script></html>
