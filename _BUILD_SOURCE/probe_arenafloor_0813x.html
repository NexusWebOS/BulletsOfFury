<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>probe 0813x</title>
<!-- ⚠ THE PROBE LIVES IN _BUILD_SOURCE BUT THE GAME'S ASSET PATHS ARE RELATIVE TO THE ROOT.
     <base> re-points every relative URL below (manifest, section_geom, game.js, and every lazy
     asset XART fetches at runtime) at the project root, so the probe can sit with the other
     build tools instead of being dropped in the root next to index.html. -->
<base href="../">
<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;}
  #screen-area{position:absolute;left:0;top:0;width:480px;height:512px;overflow:hidden;}
  #screen{display:block;position:absolute;left:0;top:0;width:480px;height:512px;image-rendering:pixelated;background:#000;}
  #hud-wrap,#equip-dom{position:absolute;left:-9999px;top:-9999px;}
  #tag{position:absolute;left:0;top:512px;color:#0f0;font:12px monospace;}
</style></head>
<body>
<div id="screen-area"><canvas id="screen" width="480" height="512"></canvas></div>
<div id="hud-wrap"><canvas id="hud" width="480" height="62"></canvas></div>
<div id="equip-dom"><canvas id="equipcv" width="128" height="128"></canvas></div>
<div id="tag">boot</div>
<script src="assets/manifest.js"></script>
<script src="assets/section_geom.js"></script>
<script src="assets/game.js"></script>
<script>
/* PROBE 0813x — render the stage-2 boss arena at a chosen point in the floor slide.
   ?at=<seconds of arena time>   0 = the open-lava arrival, >HOLD = the floor sliding back down.

   Drives the game's own updatePlay/drawWorld the way the harness scripts do, at a FIXED dt, so the
   frame is a function of `at` and not of how fast this machine happened to run. */
(function(){
  var Q = new URLSearchParams(location.search);
  var AT = parseFloat(Q.get('at') || '0');
  var tag = document.getElementById('tag');
  function say(s){ tag.textContent = s; }

  /* ⚠ XART.rdy() IS FALSE ON ITS FIRST CALL — that call is what starts the lazy load. Poll it, and
     poll on a real timer so the network actually gets a turn between checks. */
  var need = ['nst2_master'];
  var tries = 0;
  function ready(){
    if (typeof XART === 'undefined') return false;
    var ok = true;
    for (var i=0;i<need.length;i++){ if(!XART.rdy(need[i])) ok = false; }
    var lf = (typeof _liquidFrames === 'function') ? _liquidFrames('nlq2_lava') : null;
    if (!lf || !lf.length) ok = false;
    return ok;
  }
  function boot(){
    tries++;
    if (!ready()){
      if (tries > 400) { say('ART NEVER ARRIVED after ' + tries + ' polls'); return; }
      setTimeout(boot, 25); return;
    }
    run.stage = 2; curStage = STAGES[1];
    beginStage(2);
    setState(GS.PLAY);
    player.reset();
    spawnBoss(STAGES[1].boss);
    boss.enter = false; boss.y = 120;          // past the entrance, so the arena clock is the variable
    var DT = 1/60, frames = Math.max(1, Math.round(AT / DT));
    for (var f = 0; f < frames; f++){
      /* ⚠ THE BOSS KILLS THE PLAYER MID-PROBE and the SHIP DESTROYED banner then covers the band
         being measured. Kept alive so the background is what the frame is about. */
      player.dead = false; player.invuln = 0; player.hp = 99;
      try { updatePlay(DT); } catch(e){}
      try { drawWorld(DT); } catch(e){}
    }
    /* what the frame actually contains, read off the game rather than recomputed */
    var info = {
      at: AT, frames: frames,
      arenaT: (typeof _arenaFloorT !== 'undefined') ? +_arenaFloorT.toFixed(2) : 'n/a',
      masterSrcY: (typeof _masterSrcY !== 'undefined') ? Math.round(_masterSrcY) : 'n/a',
      bossKind: (boss && boss.kind) || 'none',
      emerges: !!(boss && (boss._gen || boss._mech)),
      bossActive: !!bossActive
    };
    /* ⚠ AND READ THE PIXELS, not the state. The whole point is where the terrain edge IS on screen.
       Row-mean luminance down the left margin (x 4..60), away from the boss and the player, then the
       biggest row-to-row step in it — that step is the leading edge of the floor sliding down. */
    try {
      var cv = document.getElementById('screen');
      var g2 = cv.getContext('2d');
      var d = g2.getImageData(4, 0, 56, cv.height).data;
      var means = [], W = 56;
      for (var y = 0; y < cv.height; y++){
        var s = 0;
        for (var x = 0; x < W; x++){
          var i = (y*W + x)*4;
          s += (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114);
        }
        means.push(s/W);
      }
      var bestY = -1, bestD = 0;
      for (var y = 3; y < means.length-3; y++){
        var a = (means[y-3]+means[y-2]+means[y-1])/3, b = (means[y]+means[y+1]+means[y+2])/3;
        var dd = Math.abs(b-a);
        if (dd > bestD){ bestD = dd; bestY = y; }
      }
      info.edgeY = bestY; info.edgeStep = +bestD.toFixed(1);
      var prof = [];
      for (var y = 0; y < cv.height; y += 32) prof.push(Math.round(means[y]));
      info.rowProfile = prof;
    } catch(e){ info.pixels = 'BLOCKED: ' + e.name; }
    say(JSON.stringify(info));
  }
  boot();
})();
</script>
</body></html>
