<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rime effects - 32-frame PixelLab banks</title><link rel="icon" href="data:,">
<style>body{background:#080e18;color:#d5edff;font:14px system-ui;margin:20px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#9addff}select,button{background:#1a2d45;color:#fff;border:1px solid #84a8c7;padding:8px}main{display:flex;gap:24px;flex-wrap:wrap;margin-top:20px}canvas{background:#030812;border:1px solid #354e67;image-rendering:pixelated;max-width:92vw}p{max-width:720px;line-height:1.5}</style>
<nav><a href="index.html">Full-FOV encounter</a><label>Bank <select id="bank"><option value="swirl">Frost swirl</option><option value="charge">Reactor charge</option><option value="mortar">Shoulder laser mortar</option></select></label><button id="pause">Pause</button><label>Frame <input id="frame" type="range" min="0" max="31" value="0"></label><label><input id="onion" type="checkbox" checked> Adjacent-frame onions</label><output id="status">Loading...</output></nav>
<main><canvas id="view"></canvas><canvas id="strip"></canvas></main><p>Each bank has 32 generated poses at a common scale and pivot. Orange crosshairs show the fixed reactor center or mortar impact anchor. Onions show the preceding and following poses at the same registration. No per-frame fitting, tiling or manufactured warp poses.</p>
<script>
(async()=>{const manifest=await(await fetch('../../../assets/game/shared/combat/rime_effects_1019/manifest.json')).json(),images={};
 for(const [bank,frames]of Object.entries(manifest.banks))images[bank]=await Promise.all(frames.map(a=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>no(Error(a.path));im.src='../../../'+a.path;})));
 const view=document.querySelector('#view'),strip=document.querySelector('#strip'),select=document.querySelector('#bank'),slider=document.querySelector('#frame'),onion=document.querySelector('#onion'),status=document.querySelector('#status');let play=true,last=0;
 function draw(){const bank=select.value,frames=manifest.banks[bank],f=+slider.value,a=frames[f],ims=images[bank],s=2,p=a.pivot,g=view.getContext('2d');view.width=a.w*s;view.height=a.h*s;g.imageSmoothingEnabled=false;
  if(onion.checked){g.globalAlpha=.22;for(const j of [(f+31)%32,(f+1)%32])g.drawImage(ims[j],0,0,a.w*s,a.h*s);g.globalAlpha=1;}g.drawImage(ims[f],0,0,a.w*s,a.h*s);g.strokeStyle='#ffb04d';g.beginPath();g.moveTo(p[0]*s-7,p[1]*s);g.lineTo(p[0]*s+7,p[1]*s);g.moveTo(p[0]*s,p[1]*s-7);g.lineTo(p[0]*s,p[1]*s+7);g.stroke();
  const k=bank==='mortar'?.5:1;strip.width=a.w*8*k;strip.height=a.h*4*k;const c=strip.getContext('2d');c.imageSmoothingEnabled=false;for(let i=0;i<32;i++){const x=i%8*a.w*k,y=Math.floor(i/8)*a.h*k;c.drawImage(ims[i],x,y,a.w*k,a.h*k);c.fillStyle=i===f?'#ffb04d':'#d8edff';c.fillText(String(i),x+3,y+12);}status.textContent=(f+1)+' / 32 - '+a.w+' x '+a.h+' - pivot '+p.join(',');}
 select.onchange=slider.oninput=onion.onchange=draw;document.querySelector('#pause').onclick=e=>{play=!play;e.target.textContent=play?'Pause':'Play';};
 function tick(t){if(play&&t-last>1000/18){slider.value=(+slider.value+1)%32;last=t;draw();}requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);
})().catch(e=>{document.querySelector('#status').textContent=e.message;console.error(e);});
</script></html>
