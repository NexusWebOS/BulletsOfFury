<!doctype html><meta charset="utf-8"><title>Hammer correction review</title><style>body{background:#101821;color:#d9f7ff;font:17px system-ui;margin:24px}canvas{image-rendering:pixelated;background:#172536;max-width:95vw}button,select,input{font:inherit;margin:8px}img{max-width:30vw}</style><h1>Hammer correction — frame review</h1><p>Stage 5 down/side strikes; re-authored corrupted Hammer. Physical head marker in green. Onion view shows adjacent frames at the same fixed pivot.</p><select id="bank"></select><button id="play">Pause</button><label><input id="onion" type="checkbox" checked>Onion</label><input id="frame" type="range" min="0" value="0"><span id="label"></span><br><canvas id="cv" width="640" height="640"></canvas><h2>Native combat captures</h2><img src="stage5-storm_slam.png"><img src="stage8-skystrike.png"><img src="stage8-gun.png"><script src="../../../assets/hammer_correction_art_1022.js"></script><script>
const bank=document.querySelector('#bank'),slider=document.querySelector('#frame'),c=document.querySelector('canvas'),ctx=c.getContext('2d'),cache={};let running=true,t=0;
for(const name of Object.keys(H22_ART.banks)){let o=document.createElement('option');o.value=o.textContent=name;bank.append(o)}
function draw(){const rows=H22_ART.banks[bank.value],i=+slider.value,a=rows[i];slider.max=rows.length-1;ctx.clearRect(0,0,640,640);ctx.imageSmoothingEnabled=false;
function cell(n,alpha){let r=rows[(n+rows.length)%rows.length],s=H22_ART.sheets[r.sheet],im=cache[r.sheet];if(!im){im=cache[r.sheet]=new Image();im.src='../../../'+s.path;im.onload=draw}if(!im.complete||!im.naturalWidth)return;ctx.globalAlpha=alpha;ctx.drawImage(im,...r.cell,(640-r.w*1.6)/2,(640-r.h*1.6)/2,r.w*1.6,r.h*1.6)}
if(document.querySelector('#onion').checked){cell(i-1,.18);cell(i+1,.18)}cell(i,1);ctx.globalAlpha=1;ctx.strokeStyle='#42ff84';ctx.beginPath();ctx.arc((640-a.w*1.6)/2+a.tip[0]*1.6,(640-a.h*1.6)/2+a.tip[1]*1.6,5,0,Math.PI*2);ctx.stroke();document.querySelector('#label').textContent=i+' / '+(rows.length-1)}
bank.onchange=()=>{slider.value=0;draw()};slider.oninput=draw;document.querySelector('#onion').onchange=draw;document.querySelector('#play').onclick=e=>{running=!running;e.target.textContent=running?'Pause':'Play'};setInterval(()=>{if(running){slider.value=(+slider.value+1)%H22_ART.banks[bank.value].length;draw()}},120);draw();</script>
