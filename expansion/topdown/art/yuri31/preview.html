<!doctype html><html lang="en"><meta charset="utf-8"><title>Yuri / Turn, roll and floor fire</title><style>
body{margin:24px;background:#101b24;color:#e3eef4;font:16px system-ui}main{max-width:1080px;margin:auto}h1{font-size:27px}p{line-height:1.5;max-width:930px}a{color:#8bd7ed}button,select,label{padding:9px;margin:4px;background:#223744;color:#ecf5fc;border:1px solid #527284;border-radius:4px}canvas{display:block;max-width:100%;height:auto;image-rendering:pixelated;margin-top:18px}</style>
<main><h1>Yuri / Turn, roll and floor fire</h1><p>Slide aiming turns through the shoulders and back again. The roll completes its rotation and lands standing or prone. The floor shot keeps Yuri facing forward with his gun pointed straight down.</p>
<select id="bank"><option value="slide_turn">Slide turn / return</option><option value="roll">Complete shoulder roll</option><option value="roll_prone">Roll into prone</option><option value="down_fire">Standing floor shot</option></select><button id="pause">Pause</button><button id="prev">Previous frame</button><button id="next">Next frame</button><label><input type="checkbox" id="slow" checked>Half speed</label><label><input type="checkbox" id="onion">Onion view</label><label><input type="checkbox" id="socket" checked>Gun barrel</label>
<canvas id="review" width="1080" height="540"></canvas><p id="status">Loading…</p><p><a href="../../index.html?fullscreen=0&build=overdrive1015-yuri31-r1">Play updated Overdrive</a> · <a href="../yuri30/preview.html">Other Yuri motions</a></p></main>
<script>
let pack,images={},frame=0,paused=false,clock=0,last=0,dir=1;const $=s=>document.getElementById(s),ctx=$('review').getContext('2d');
function keys(side){const n=$('bank').value;if(n==='down_fire')return side==='west'?['y31_down_idle']:pack.sequences.y31_down_fire.frames;return pack.sequences['y31_'+n+'_'+side].frames;}
function paint(){if(!pack)return;ctx.imageSmoothingEnabled=false;ctx.globalAlpha=1;ctx.fillStyle='#1b2a34';ctx.fillRect(0,0,1080,540);['west','east'].forEach((side,col)=>{const seq=keys(side),n=Math.min(seq.length-1,Math.max(0,frame)),k=seq[n],m=pack.assets[k],x=270+col*540,y=410,scale=3;
const draw=(key,a)=>{const mm=pack.assets[key];ctx.globalAlpha=a;ctx.drawImage(images[key],x-mm.anchor[0]*scale,y-mm.anchor[1]*scale,mm.size[0]*scale,mm.size[1]*scale);ctx.globalAlpha=1;};ctx.strokeStyle='#3b6254';ctx.beginPath();ctx.moveTo(col*540+25,y);ctx.lineTo(col*540+515,y);ctx.moveTo(x,70);ctx.lineTo(x,460);ctx.stroke();if($('onion').checked){draw(seq[Math.max(0,n-1)],.17);draw(seq[Math.min(seq.length-1,n+1)],.17);}draw(k,1);if($('socket').checked&&m.muzzle){ctx.strokeStyle='#ffc36d';ctx.strokeRect(x+(m.muzzle[0]-96)*scale-3,y+(m.muzzle[1]-160)*scale-3,6,6);}ctx.font='18px monospace';ctx.fillStyle='#e1edf8';ctx.fillText(($('bank').value==='down_fire'?(side==='west'?'STANDING / AIM DOWN':'FIRING DOWN'):side.toUpperCase())+' / '+(n+1)+' of '+seq.length,col*540+25,38);ctx.fillText(k,col*540+25,500);});$('status').textContent=(paused?'Paused':'Playing')+' · authored frames · fixed 192 × 224 cells';}
function step(d){const len=keys('east').length;frame=(frame+d+len)%len;paint();}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Play':'Pause';};$('prev').onclick=()=>{paused=true;step(-1);};$('next').onclick=()=>{paused=true;step(1);};$('bank').onchange=()=>{frame=clock=0;dir=1;paint();};$('onion').onchange=$('socket').onchange=paint;
async function start(){pack=await(await fetch('manifest.json')).json();await Promise.all(Object.entries(pack.assets).map(([k,m])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[k]=im;resolve();};im.onerror=reject;im.src='../../../../'+m.file;})));paint();requestAnimationFrame(tick);}
function tick(t){const dt=last?(t-last)/1000:0;last=t;if(!paused){const n=$('bank').value,len=keys('east').length,q=n==='down_fire'?pack.sequences.y31_down_fire:pack.sequences['y31_'+n+'_east'];clock+=dt*($('slow').checked?.5:1);if(clock>=1/q.fps){clock%=1/q.fps;if(n==='slide_turn'){frame+=dir;if(frame>=len-1){frame=len-1;dir=-1;clock=-.18;}else if(frame<=0){frame=0;dir=1;clock=-.18;}}else{frame++;if(frame>=len){frame=0;clock=-.25;}}paint();}}requestAnimationFrame(tick);}start().catch(e=>$('status').textContent='Asset error: '+e);
</script></html>
